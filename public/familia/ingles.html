<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Missão Inglês do Samuel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* VOICE: alegre, de caderno escolar, igual às missões de Português e Matemática
   IDEA: um estádio de esportes; cada fase é uma "quadra" com cor própria
   PICTURE: figuras grandes dos esportes em cada pergunta, com selo 👍/👎 ou 😀/😞
   COLOUR and TYPE: azul-estádio, amarelo-troféu, verde-gramado; Baloo 2 + Nunito
   LAYOUT: placar no topo, grade de fases, desafio em um cartão central */
:root{
  --bg:#EEF3FF; --paper:#FFFFFF; --ink:#1B2350; --muted:#59618C; --line:#D3DCF6; --rule:rgba(51,85,224,.07);
  --blue:#3355E0; --sun:#F5B10A; --ok:#178F5B; --okbg:#E1F6EA; --bad:#D63A50; --badbg:#FDE6EA;
  --w1:#3355E0; --w2:#E0662A; --w3:#8A4FD8; --w4:#178F5B; --w5:#D93D78; --w6:#0C8EA8;
  --t1:#E6ECFF; --onaccent:#FFFFFF;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10152C; --paper:#1A2145; --ink:#EEF1FF; --muted:#A9B1DA; --line:#2F3870; --rule:rgba(124,147,255,.06);
  --blue:#7C93FF; --sun:#FFC94A; --ok:#4FD39A; --okbg:#143A2B; --bad:#FF7A8C; --badbg:#47202B;
  --w1:#6F88FF; --w2:#FF8A4F; --w3:#B286FF; --w4:#3FC98C; --w5:#FF6FA5; --w6:#35C3DE;
  --t1:#242C5A; --onaccent:#10152C; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10152C; --paper:#1A2145; --ink:#EEF1FF; --muted:#A9B1DA; --line:#2F3870; --rule:rgba(124,147,255,.06);
  --blue:#7C93FF; --sun:#FFC94A; --ok:#4FD39A; --okbg:#143A2B; --bad:#FF7A8C; --badbg:#47202B;
  --w1:#6F88FF; --w2:#FF8A4F; --w3:#B286FF; --w4:#3FC98C; --w5:#FF6FA5; --w6:#35C3DE;
  --t1:#242C5A; --onaccent:#10152C; color-scheme:dark }
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;overflow-x:clip;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:820px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800} h2{font-size:1.6rem;font-weight:800} h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.em{font-family:var(--emoji);line-height:1}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .s{color:var(--sun)}
.sub{color:var(--muted);font-weight:700}
.card{background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.stadium{display:grid;grid-template-columns:repeat(4,56px);gap:6px;font-size:2.4rem}
.stadium span{display:grid;place-items:center;height:56px;border-radius:14px;background:var(--t1)}
@media(max-width:600px){.hero{grid-template-columns:1fr}.stadium{grid-template-columns:repeat(8,minmax(0,1fr));font-size:1.7rem}.stadium span{height:44px}}
.exam{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--onaccent);border-radius:12px;padding:6px 12px;font-weight:800;align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.world{background:var(--paper);border:2px solid var(--line);border-bottom:6px solid var(--wc);border-radius:18px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s}
.world:hover{transform:translateY(-3px)}
.world .glyph{background:var(--wc);color:var(--onaccent);font-family:var(--display);font-weight:800;font-size:1.45rem;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.world .glyph .em{font-size:1.8rem}
.world .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}
.world .desc{color:var(--muted);font-size:.95rem}
.stars{font-size:1.3rem;letter-spacing:2px;color:var(--line)} .stars .on{color:var(--sun)}
.tipbar{border-left:6px solid var(--sun);background:var(--paper);border-radius:12px;padding:12px 14px;font-weight:700}
.sim{background:var(--ink);color:var(--bg);border:none;border-radius:18px;padding:18px;text-align:left;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.sim h2{color:var(--bg)}
.sim .go{background:var(--sun);color:#1B2350;border-radius:12px;padding:8px 16px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:800;text-decoration:underline;padding:8px 0;align-self:flex-start;min-height:44px}
.btn{background:var(--blue);color:var(--onaccent);border:none;border-bottom:4px solid rgba(0,0,0,.25);border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:800;font-size:1.2rem;min-height:48px}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.t{font-weight:800;color:var(--wc,var(--blue))}
.alert{background:var(--badbg);border:2px solid var(--bad);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.alert b.h{color:var(--bad);font-family:var(--display);font-size:1.15rem}
.good{background:var(--okbg);border:2px solid var(--ok);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.say{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;color:var(--blue);min-height:36px}
.vocab{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.vc{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.vc .em{font-size:3.2rem;padding:4px 0}
.vc b{font-family:var(--display);font-size:1.2rem;line-height:1.1}
.vc small{color:var(--muted);font-weight:700}
.vc.flip{cursor:pointer;min-height:150px;justify-content:center}
.vc.flip .back{display:none}
.vc.flip.open .back{display:flex;flex-direction:column;align-items:center;gap:2px}
.vc.flip.open{border-color:var(--ok)}
.ex{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:center}
.ex .em{font-size:2.2rem}
.ex .s{font-family:var(--display);font-weight:700;font-size:1.25rem}
.ex .s small{display:block;font-family:var(--body);font-size:.9rem;color:var(--muted);font-weight:700}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.mi{display:flex;align-items:center;gap:10px;background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:8px 12px;text-align:left;font-weight:800;min-height:56px}
.mi .em{font-size:1.8rem}
.mi.yes{border-color:var(--ok);background:var(--okbg)} .mi.no{border-color:var(--bad);background:var(--badbg)}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--wc,var(--blue));border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--muted)}
.combo{color:var(--w2)}
.stage{display:flex;justify-content:center;padding:6px 0}
.pic{position:relative;width:min(190px,48vw);aspect-ratio:1;border-radius:28px;background:var(--t1);border:3px solid var(--line);display:grid;place-items:center;font-size:clamp(5rem,22vw,7.5rem)}
.pic .badge{position:absolute;right:-12px;bottom:-12px;width:64px;height:64px;border-radius:50%;background:var(--paper);border:3px solid var(--line);display:grid;place-items:center;font-size:2.4rem}
.pic .badge.y{border-color:var(--ok)} .pic .badge.n{border-color:var(--bad)}
.q{font-family:var(--display);font-weight:700;font-size:1.5rem;line-height:1.25;text-align:center}
.qpt{text-align:center;color:var(--muted);font-weight:700;margin-top:-8px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:480px){.opts.txt{grid-template-columns:1fr}}
.opt{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;text-align:left;font-weight:800;font-size:1.15rem;min-height:56px}
.opts.pics .opt{text-align:center;font-family:var(--emoji);font-size:3.6rem;padding:10px;line-height:1.1}
.opt:hover:not(:disabled){border-color:var(--wc,var(--blue))}
.opt.right{background:var(--okbg);border-color:var(--ok)} .opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slot{width:46px;height:56px;border:3px dashed var(--line);border-radius:12px;background:var(--paper);font-family:var(--display);font-weight:800;font-size:1.7rem;display:grid;place-items:center;padding:0}
@media(max-width:480px){.slot{width:38px;height:50px;font-size:1.5rem}.slots{gap:4px}}
.slot.f{border-style:solid;border-color:var(--wc)}
.slot.right{background:var(--okbg);border-color:var(--ok)} .slot.wrong{background:var(--badbg);border-color:var(--bad)}
.pool{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:12px;padding:8px 14px;font-family:var(--display);font-weight:800;font-size:1.4rem;min-width:48px;min-height:52px}
.tile.used{visibility:hidden}
.ans{min-height:68px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.ans .ph{color:var(--muted);font-weight:700}
.ans.right{border-color:var(--ok);background:var(--okbg)} .ans.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)} .fb.no{background:var(--badbg);border:2px solid var(--bad)}
.fb b.h{font-family:var(--display);font-size:1.25rem}
.fb.ok b.h{color:var(--ok)} .fb.no b.h{color:var(--bad)}
.result{align-items:center;text-align:center}
.result .stars{font-size:3rem}
.grade{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;color:var(--wc,var(--blue));font-variant-numeric:tabular-nums}
.miss-list{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.miss-item{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:12px;align-items:center}
.miss-item .em{font-size:2rem}
.miss-item .c{color:var(--ok);font-weight:800}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:190px minmax(0,1fr) 54px;gap:10px;align-items:center;font-weight:700}
.bar .track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;border-radius:99px}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
@media(max-width:480px){.bar{grid-template-columns:1fr 54px}.bar .track{grid-column:1/-1;grid-row:2}}
.rev{display:flex;flex-wrap:wrap;gap:8px}
.rev span{background:var(--badbg);border:2px solid var(--bad);border-radius:999px;padding:4px 12px;font-weight:800}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.shake{animation:none}.world{transition:none}}
.foot{color:var(--muted);font-size:.85rem;text-align:center}
</style></head><body>
<div class="wrap" id="app"></div>
<script>
{
/* ===================== DADOS ===================== */
const SP = [
  {e:'⚽',w:'soccer',pt:'futebol',sd:'sóquer'},
  {e:'🏀',w:'basketball',pt:'basquete',sd:'béskit-ból'},
  {e:'🏐',w:'volleyball',pt:'vôlei',sd:'váli-ból'},
  {e:'🎾',w:'tennis',pt:'tênis',sd:'ténis'},
  {e:'🏓',w:'table tennis',pt:'tênis de mesa (pingue-pongue)',sd:'têibou ténis'},
  {e:'⚾',w:'baseball',pt:'beisebol',sd:'bêis-ból'},
  {e:'🏊',w:'swimming',pt:'natação',sd:'suímin'},
  {e:'🏃',w:'running',pt:'corrida',sd:'rânin'},
  {e:'🚴',w:'cycling',pt:'ciclismo (andar de bicicleta)',sd:'sáiclin'},
  {e:'🛹',w:'skateboarding',pt:'andar de skate',sd:'skêit-bórdin'},
  {e:'🏄',w:'surfing',pt:'surfe',sd:'sârfin'},
  {e:'🤸',w:'gymnastics',pt:'ginástica',sd:'djim-néstics'},
  {e:'🥋',w:'karate',pt:'caratê',sd:'karáti'},
  {e:'⛸️',w:'skating',pt:'patinação',sd:'skêitin'}
];
const SPELL = ['soccer','tennis','karate','skating','surfing','running','swimming','cycling','baseball'];
const byW = w => SP.find(s=>s.w===w);

/* ===================== AJUDANTES ===================== */
const $ = s => document.querySelector(s);
const app = $('#app');
const rnd = n => Math.floor(Math.random()*n);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]} return a };
const sample = (a,n) => shuffle(a).slice(0,n);
const others = (s,n) => sample(SP.filter(x=>x!==s),n);
const LS = 'missaoIngles_v1';
let store = {best:{},sim:0,plays:0,miss:{}};
try{ const r = localStorage.getItem(LS); if(r) store = Object.assign(store, JSON.parse(r)); }catch(e){}
const save = () => { try{ localStorage.setItem(LS, JSON.stringify(store)); }catch(e){} };
const canSpeak = (()=>{ try{ return 'speechSynthesis' in window && typeof SpeechSynthesisUtterance!=='undefined'; }catch(e){ return false } })();
function speak(t){
  if(!canSpeak) return;
  try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.lang='en-US'; u.rate=.85;
    const v=speechSynthesis.getVoices().find(v=>/^en(-|_)US/i.test(v.lang)); if(v) u.voice=v; speechSynthesis.speak(u); }catch(e){}
}
const sayBtn = t => canSpeak ? `<button class="say" data-say="${t}"><span class="em">🔊</span> Ouvir</button>` : '';
const starsHtml = n => `<span class="stars">${[1,2,3].map(i=>`<span class="${i<=n?'on':''}">★</span>`).join('')}</span>`;
const starsOf = p => p>=1?3:p>=.75?2:p>=.5?1:0;
const picHtml = (e,b,bc) => `<div class="stage"><div class="pic em">${e}${b?`<span class="badge ${bc}">${b}</span>`:''}</div></div>`;

/* ===================== GERADORES DE PERGUNTAS ===================== */
const gPic2Word = s => ({t:'opts',k:s.w,pic:s.e,q:'What sport is this?',qpt:'Que esporte é este?',
  opts:shuffle([s,...others(s,3)].map(x=>x.w)),ans:s.w,exp:`${s.e} é <b>${s.w}</b> (${s.pt}).`});
const gWord2Pic = s => ({t:'pics',k:s.w,q:`Find: ${s.w}`,qpt:'Toque na figura certa.',say:s.w,
  opts:shuffle([s,...others(s,3)].map(x=>x.e)),ans:s.e,exp:`<b>${s.w}</b> = ${s.pt} ${s.e}`});
const gSpell = s => ({t:'spell',k:s.w,pic:s.e,q:'Write the word!',qpt:`Monte a palavra em inglês para: ${s.pt}.`,ans:s.w,
  exp:`Escreve-se <b>${s.w.toUpperCase().split('').join(' ')}</b>.`});
function gLike(s){
  const like=Math.random()<.5, o=others(s,1)[0];
  const ans = like?`I like ${s.w}.`:`I don't like ${s.w}.`;
  return {t:'opts',txt:1,k:s.w,pic:s.e,b:like?'👍':'👎',bc:like?'y':'n',q:'What does the picture say?',qpt:'O que a figura está dizendo?',
    opts:shuffle([`I like ${s.w}.`,`I don't like ${s.w}.`,like?`I like ${o.w}.`:`I don't like ${o.w}.`,`Do you like ${s.w}?`]),ans,
    exp: like?`👍 = <b>I like</b> (eu gosto). ${s.e} = ${s.w}.`:`👎 = <b>I don't like</b> (eu não gosto). ${s.e} = ${s.w}.`};
}
function gAnswer(s){
  const yes=Math.random()<.5, ans=yes?'Yes, I do.':"No, I don't.";
  return {t:'opts',txt:1,k:s.w,pic:s.e,b:yes?'😀':'😞',bc:yes?'y':'n',q:`Do you like ${s.w}?`,qpt:yes?'O Samuel gosta! Como ele responde?':'O Samuel não gosta. Como ele responde?',say:`Do you like ${s.w}?`,
    opts:shuffle(['Yes, I do.',"No, I don't.",'Yes, I don\'t.','No, I do.']),ans,
    exp: yes?'Gosta 😀 → <b>Yes, I do.</b> (Sim, eu gosto.)':"Não gosta 😞 → <b>No, I don't.</b> (Não, eu não gosto.) Yes combina com do; No combina com don't."};
}
function gBlank(s,kind){
  const T = {
    q:   {q:`___ you like ${s.w}?`,o:['Do','Are','Is','Am'],a:'Do',b:'❓',bc:'',exp:'Para perguntar se alguém gosta: <b>Do</b> you like…?'},
    yes: {q:`Do you like ${s.w}? Yes, I ___.`,o:['do',"don't",'like','am'],a:'do',b:'😀',bc:'y',exp:'Resposta curta positiva: <b>Yes, I do.</b>'},
    no:  {q:`Do you like ${s.w}? No, I ___.`,o:["don't",'do','like','not'],a:"don't",b:'😞',bc:'n',exp:"Resposta curta negativa: <b>No, I don't.</b>"},
    neg: {q:`I ___ like ${s.w}.`,o:["don't",'not','no','am'],a:"don't",b:'👎',bc:'n',exp:"Para dizer que não gosta: I <b>don't</b> like… (don't = do not)."},
    pos: {q:`I ___ ${s.w}.`,o:['like','likes','liking',"don't"],a:'like',b:'👍',bc:'y',exp:'Com I usamos <b>like</b> (sem s): I like…'}
  }[kind];
  return {t:'opts',k:s.w,pic:s.e,b:T.b,bc:T.bc,q:T.q,qpt:'Complete a frase.',opts:shuffle(T.o),ans:T.a,exp:T.exp};
}
function gOrder(s){
  const k = rnd(4); let words, b='', bc='', pt;
  if(k===0){ words=['Do','you','like',s.w+'?']; b='❓'; pt=`Pergunte se a pessoa gosta de ${s.pt}.`; }
  else if(k===1){ words=['I','like',s.w+'.']; b='👍'; bc='y'; pt=`Diga que você gosta de ${s.pt}.`; }
  else if(k===2){ words=['I',"don't",'like',s.w+'.']; b='👎'; bc='n'; pt=`Diga que você não gosta de ${s.pt}.`; }
  else { words=['No,','I',"don't",'like',s.w+'.']; b='😞'; bc='n'; pt=`Responda que não gosta de ${s.pt}.`; }
  return {t:'order',k:s.w,pic:s.e,b,bc,q:'Put the words in order!',qpt:pt,words,ans:words.join(' '),exp:`A frase certa é: <b>${words.join(' ')}</b>`};
}
const pickSp = n => { let a=[]; while(a.length<n) a=a.concat(shuffle(SP)); return a.slice(0,n) };

/* ===================== FASES ===================== */
const WORLDS = [
  {id:'words',e:'🏆',name:'Sports Words',pt:'Palavras dos esportes',c:'--w1',desc:'Veja a figura e escolha o nome do esporte.',n:8,
    gen:()=>pickSp(8).map(gPic2Word)},
  {id:'find',e:'👀',name:'Find the Picture',pt:'Ache a figura',c:'--w2',desc:'Leia (e ouça) a palavra e toque na figura certa.',n:8,
    gen:()=>pickSp(8).map(gWord2Pic)},
  {id:'spell',e:'✏️',name:'Spelling',pt:'Soletrando',c:'--w3',desc:'Monte as palavras letra por letra.',n:6,
    gen:()=>sample(SPELL,6).map(w=>gSpell(byW(w)))},
  {id:'like',e:'👍',name:"I like / I don't like",pt:'Eu gosto / não gosto',c:'--w4',desc:'Use 👍 e 👎 para escolher e completar frases.',n:8,
    gen:()=>pickSp(8).map((s,i)=>i%3===2?gBlank(s,Math.random()<.5?'neg':'pos'):gLike(s))},
  {id:'ask',e:'❓',name:'Do you like…?',pt:'Você gosta de…?',c:'--w5',desc:'Pergunte e responda: Yes, I do. / No, I don\'t.',n:8,
    gen:()=>pickSp(8).map((s,i)=>i%2?gBlank(s,['q','yes','no'][rnd(3)]):gAnswer(s))},
  {id:'build',e:'🧩',name:'Build the Sentence',pt:'Monte a frase',c:'--w6',desc:'Coloque as palavras na ordem certa.',n:6,
    gen:()=>pickSp(6).map(gOrder)}
];
const wById = id => WORLDS.find(w=>w.id===id);
const SIM = {id:'sim',e:'📝',name:'Simulado',pt:'Prova de treino',c:'--blue',n:15,
  gen:()=>shuffle(WORLDS.flatMap(w=>w.gen().slice(0,w.id==='spell'||w.id==='build'?2:3))).slice(0,15)};

/* ===================== LIÇÕES ===================== */
const vocabCards = () => SP.map(s=>`<div class="vc"><span class="em">${s.e}</span><b>${s.w}</b><small>${s.pt}</small><small>fala-se: “${s.sd}”</small>${sayBtn(s.w)}</div>`).join('');
const flipCards = () => shuffle(SP).map(s=>`<button class="vc flip" data-flip><span class="em">${s.e}</span><span class="back"><b>${s.w}</b><small>${s.pt}</small></span></button>`).join('');
const LESSONS = {
  words: () => `<p>Estas são as palavras de <b>Sports</b> (esportes). Toque em <b>Ouvir</b> para escutar a pronúncia.</p>
    <div class="vocab">${vocabCards()}</div>
    <div class="tipbar"><span class="em">💡</span> Futebol em inglês pode ser <b>soccer</b> (Estados Unidos) ou <b>football</b> (Inglaterra). Se o livro usar <b>football</b>, as duas estão certas!</div>`,
  find: () => `<p>Treino de memória: olhe a figura, tente lembrar o nome em inglês e <b>toque para conferir</b>.</p>
    <div class="vocab">${flipCards()}</div>`,
  spell: () => `<p>Algumas palavras têm pegadinhas na escrita. Fique de olho:</p>
    <div class="ex">
      <span class="em">⚽</span><div class="s">so<span class="t">cc</span>er<small>duas letras C</small></div>
      <span class="em">🎾</span><div class="s">te<span class="t">nn</span>is<small>duas letras N</small></div>
      <span class="em">🏊</span><div class="s">swi<span class="t">mm</span>ing<small>dois M antes de -ing</small></div>
      <span class="em">🏃</span><div class="s">ru<span class="t">nn</span>ing<small>dois N antes de -ing</small></div>
      <span class="em">🏀</span><div class="s">basket + <span class="t">ball</span><small>basketball, volleyball, baseball: todas terminam em ball (bola)</small></div>
      <span class="em">🏄</span><div class="s">surf + <span class="t">ing</span><small>muitos esportes terminam em -ing: surfing, skating, cycling</small></div>
    </div>`,
  like: () => `<div class="ex">
      <span class="em">👍</span><div class="s">I like soccer.<small>Eu gosto de futebol.</small></div>
      <span class="em">👎</span><div class="s">I don't like tennis.<small>Eu não gosto de tênis.</small></div>
    </div>
    <div class="good"><b>Como montar:</b> I + like + esporte. Para dizer que <b>não</b> gosta, coloque <b>don't</b> antes de like.</div>
    <div class="alert"><b class="h">Atenção!</b><span><b>don't</b> = do not. Não escreva “I no like” nem “I not like”.</span></div>
    <h3>Minha vez: do que <i>você</i> gosta?</h3>
    <p class="sub">Toque em cada esporte para trocar entre 👍 e 👎 e leia a frase.</p>
    <div class="mine">${SP.map((s,i)=>`<button class="mi" data-mine="${i}"><span class="em">${s.e}</span><span>Toque aqui: ${s.w}</span></button>`).join('')}</div>`,
  ask: () => `<div class="ex">
      <span class="em">❓</span><div class="s">Do you like swimming?<small>Você gosta de natação?</small></div>
      <span class="em">😀</span><div class="s">Yes, I do.<small>Sim, eu gosto.</small></div>
      <span class="em">😞</span><div class="s">No, I don't.<small>Não, eu não gosto.</small></div>
    </div>
    <div class="row">${sayBtn('Do you like swimming? Yes, I do. No, I don\'t.')}</div>
    <div class="good"><b>Pergunta:</b> sempre começa com <b>Do you like</b> … e termina com <b>?</b></div>
    <div class="alert"><b class="h">Pegadinha!</b><span><b>Yes</b> anda com <b>do</b>. <b>No</b> anda com <b>don't</b>. “Yes, I don't” e “No, I do” estão errados.</span></div>`,
  build: () => `<p>Em inglês, a ordem das palavras é sempre a mesma:</p>
    <div class="ex">
      <span class="em">❓</span><div class="s">Do + you + like + esporte?<small>Do you like karate?</small></div>
      <span class="em">👍</span><div class="s">I + like + esporte.<small>I like karate.</small></div>
      <span class="em">👎</span><div class="s">I + don't + like + esporte.<small>I don't like karate.</small></div>
    </div>
    <div class="tipbar"><span class="em">💡</span> Frase começa com letra maiúscula e termina com ponto (.) ou ponto de interrogação (?).</div>`
};

/* ===================== TELAS ===================== */
let run = null;
function totalStars(){ return WORLDS.reduce((a,w)=>a+starsOf(store.best[w.id]||0),0) }

function home(){
  app.innerHTML = `
  <div class="top"><h1>Missão Inglês do Samuel</h1>
    <div class="chips"><span class="chip"><span class="s">★</span> ${totalStars()} / 18</span><span class="chip">📝 Simulado: ${store.sim?store.sim.toFixed(1):'—'}</span></div></div>
  <div class="card hero"><div style="display:flex;flex-direction:column;gap:8px">
      <span class="exam"><span class="em">🏟️</span> Prova de Inglês</span>
      <h2>Sports &amp; Do you like…?</h2>
      <p>Aprenda os nomes dos esportes em inglês e a dizer do que você gosta e do que não gosta. Abra uma fase, leia a explicação e depois jogue!</p>
    </div>
    <div class="stadium em">${SP.slice(0,8).map(s=>`<span>${s.e}</span>`).join('')}</div></div>
  <div class="grid">${WORLDS.map((w,i)=>`
    <button class="world" style="--wc:var(${w.c})" data-world="${w.id}">
      <div class="glyph"><span>${i+1}. ${w.name}</span><span class="em">${w.e}</span></div>
      <div class="body"><b>${w.pt}</b><span class="desc">${w.desc}</span>${starsHtml(starsOf(store.best[w.id]||0))}</div>
    </button>`).join('')}</div>
  <button class="sim" data-play="sim"><div><h2>Simulado final</h2><p>15 perguntas misturadas, com nota de 0 a 10.</p></div><span class="go">Começar ▶</span></button>
  <div class="tipbar"><span class="em">💡</span> Dica: faça as fases na ordem. Três estrelas em todas = pronto para a prova!</div>
  <button class="linkbtn" data-go="painel">Painel da família ▸</button>
  <p class="foot">O progresso fica salvo neste aparelho.</p>`;
}

function lesson(id){
  const w = wById(id);
  app.innerHTML = `<button class="linkbtn" data-go="home">◂ Voltar às fases</button>
  <div class="card" style="--wc:var(${w.c})">
    <div class="row" style="justify-content:space-between"><h2><span class="em">${w.e}</span> ${w.name}</h2>${starsHtml(starsOf(store.best[w.id]||0))}</div>
    <p class="sub">${w.pt}</p>
    ${LESSONS[id]()}
    <div class="row"><button class="btn" style="background:var(${w.c})" data-play="${id}">Jogar ▶</button></div>
  </div>`;
}

function play(id){
  const w = id==='sim'?SIM:wById(id);
  run = {w, qs:w.gen(), i:0, ok:0, combo:0, misses:[], done:false};
  question();
}

function question(){
  const {w,qs,i} = run, q = qs[i];
  run.done=false; run.sel=[];
  let body='';
  if(q.t==='opts') body = `<div class="opts ${q.txt?'txt':''}">${q.opts.map(o=>`<button class="opt" data-opt="${o}">${o}</button>`).join('')}</div>`;
  if(q.t==='pics') body = `<div class="opts pics">${q.opts.map(o=>`<button class="opt" data-opt="${o}">${o}</button>`).join('')}</div>`;
  if(q.t==='spell'){
    const letters = shuffle(q.ans.split(''));
    run.pool = letters; run.slots = Array(q.ans.length).fill(-1);
    body = `<div class="slots" id="slots"></div><div class="pool" id="pool"></div>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-act="clear">Apagar</button><button class="btn" data-act="check" id="chk" disabled style="background:var(${w.c})">Conferir</button></div>`;
  }
  if(q.t==='order'){
    run.pool = shuffle(q.words);
    body = `<div class="ans" id="ans"></div><div class="pool" id="pool"></div>
      <div class="row" style="justify-content:center"><button class="btn ghost" data-act="clear">Apagar</button><button class="btn" data-act="check" id="chk" disabled style="background:var(${w.c})">Conferir</button></div>`;
  }
  app.innerHTML = `<button class="linkbtn" data-go="home">◂ Sair</button>
  <div class="card" style="--wc:var(${w.c})" id="qcard">
    <div class="qhead"><span>${w.name} · ${i+1} de ${qs.length}</span><span class="combo">${run.combo>=2?`🔥 ${run.combo} seguidas!`:''}</span></div>
    <div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
    ${q.pic?picHtml(q.pic,q.b,q.bc):''}
    <p class="q">${q.q}</p><p class="qpt">${q.qpt}</p>
    ${q.say?`<div class="row" style="justify-content:center">${sayBtn(q.say)}</div>`:''}
    ${body}
    <div id="fb"></div>
  </div>`;
  if(q.t==='spell'||q.t==='order') drawBuild();
}

function drawBuild(){
  const q = run.qs[run.i];
  const used = q.t==='spell' ? run.slots.filter(x=>x>=0) : run.sel;
  $('#pool').innerHTML = run.pool.map((l,j)=>`<button class="tile ${used.includes(j)?'used':''}" data-tile="${j}" ${run.done?'disabled':''}>${l}</button>`).join('');
  if(q.t==='spell'){
    $('#slots').innerHTML = run.slots.map((p,k)=>`<button class="slot ${p>=0?'f':''}" data-slot="${k}" ${run.done?'disabled':''}>${p>=0?run.pool[p]:''}</button>`).join('');
    $('#chk').disabled = run.done || run.slots.includes(-1);
  } else {
    $('#ans').innerHTML = run.sel.length ? run.sel.map((p,k)=>`<button class="tile" data-back="${k}" ${run.done?'disabled':''}>${run.pool[p]}</button>`).join('') : '<span class="ph">Toque nas palavras abaixo…</span>';
    $('#chk').disabled = run.done || run.sel.length<run.pool.length;
  }
}

function answer(given){
  const q = run.qs[run.i], right = given===q.ans;
  run.done = true;
  if(right){ run.ok++; run.combo++; } else { run.combo=0; run.misses.push({q,given}); store.miss[q.k]=(store.miss[q.k]||0)+1; }
  const last = run.i===run.qs.length-1;
  const st = q.q.includes('___') ? q.q.replace('___',q.ans) : (q.t==='pics' ? q.say : q.ans);
  $('#fb').innerHTML = `<div class="fb ${right?'ok':'no'}"><b class="h">${right?['Great job!','Awesome!','Very good!','Perfect!'][rnd(4)]+' 🎉':'Quase! Olha só:'}</b><span>${q.exp}</span>
    <div class="row">${sayBtn(st)}<button class="btn" data-act="next" style="background:var(${run.w.c})">${last?'Ver resultado':'Próxima ▶'}</button></div></div>`;
  if(!right){ const c=$('#qcard'); c.classList.add('shake'); setTimeout(()=>c.classList.remove('shake'),350); }
  if(right) speak(st);
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}

function result(){
  const {w,qs,ok,misses} = run, p = ok/qs.length;
  store.plays++;
  if(w.id==='sim') store.sim = Math.max(store.sim||0, Math.round(p*100)/10);
  else store.best[w.id] = Math.max(store.best[w.id]||0, p);
  save();
  app.innerHTML = `<div class="card result" style="--wc:var(${w.c})">
    <h2>${w.id==='sim'?'Nota do simulado':w.name}</h2>
    ${w.id==='sim'?`<div class="grade">${(p*10).toFixed(1)}</div>`:starsHtml(starsOf(p))}
    <p class="big"><b>${ok} de ${qs.length}</b> certas. ${p===1?'Perfect! 🏆':p>=.75?'Muito bem! 💪':p>=.5?'Bom! Vamos treinar mais um pouco.':'Leia a explicação e tente de novo!'}</p>
    ${misses.length?`<h3>Para revisar</h3><div class="miss-list">${misses.map(m=>`<div class="miss-item"><span class="em">${m.q.pic||m.q.ans}</span><div><div>${m.q.q}</div><div class="sub">Você respondeu: ${m.given}</div><div class="c">Certo: ${m.q.ans}</div></div></div>`).join('')}</div>`:''}
    <div class="row" style="justify-content:center"><button class="btn" style="background:var(${w.c})" data-play="${w.id}">Jogar de novo</button>${w.id!=='sim'?`<button class="btn ghost" data-world="${w.id}">Rever explicação</button>`:''}<button class="btn ghost" data-go="home">Fases</button></div>
  </div>`;
  if(p>=.75) confetti();
}

function painel(){
  const rev = Object.entries(store.miss).sort((a,b)=>b[1]-a[1]).slice(0,8);
  app.innerHTML = `<button class="linkbtn" data-go="home">◂ Voltar às fases</button>
  <div class="card"><h2>Painel da família</h2>
    <div class="chips"><span class="chip"><span class="s">★</span> ${totalStars()} de 18 estrelas</span><span class="chip">📝 Melhor simulado: ${store.sim?store.sim.toFixed(1):'—'}</span><span class="chip">🎮 ${store.plays} partidas</span></div>
    <h3>Melhor resultado por fase</h3>
    <div class="bars">${WORLDS.map(w=>{const v=Math.round((store.best[w.id]||0)*100);return `<div class="bar"><span>${w.e} ${w.name}</span><span class="track"><i style="width:${v}%;background:var(${w.c})"></i></span><span class="v">${v}%</span></div>`}).join('')}</div>
    <h3>Esportes com mais erros</h3>
    ${rev.length?`<div class="rev">${rev.map(([k,n])=>{const s=byW(k);return `<span><span class="em">${s?s.e:''}</span> ${k} · ${n}×</span>`}).join('')}</div>`:'<p class="sub">Nenhum erro registrado ainda.</p>'}
    <div class="row"><button class="btn ghost" data-act="reset" id="reset">Apagar progresso</button></div>
  </div>`;
}

function confetti(){
  const cs=['#3355E0','#F5B10A','#178F5B','#D93D78','#E0662A'];
  for(let i=0;i<40;i++){const d=document.createElement('i');d.className='confetti';d.style.left=rnd(100)+'vw';d.style.background=cs[i%5];d.style.animationDelay=(Math.random()*.6)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
}

/* ===================== EVENTOS ===================== */
const MINE = {};
app.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  const d = b.dataset;
  if(d.say!==undefined){ speak(d.say); return; }
  if(d.go==='home'){ home(); scrollTo(0,0); return; }
  if(d.go==='painel'){ painel(); scrollTo(0,0); return; }
  if(d.world){ lesson(d.world); scrollTo(0,0); return; }
  if(d.play){ play(d.play); scrollTo(0,0); return; }
  if(d.flip!==undefined){ b.classList.toggle('open'); if(b.classList.contains('open')) speak(b.querySelector('b').textContent); return; }
  if(d.mine!==undefined){
    const s=SP[+d.mine]; MINE[d.mine] = MINE[d.mine]==='y'?'n':'y';
    const y = MINE[d.mine]==='y', t = y?`I like ${s.w}.`:`I don't like ${s.w}.`;
    b.className='mi '+(y?'yes':'no'); b.innerHTML=`<span class="em">${s.e}</span><span>${y?'👍':'👎'} ${t}</span>`; speak(t); return;
  }
  if(d.act==='reset'){
    if(b.dataset.armed){ store={best:{},sim:0,plays:0,miss:{}}; save(); painel(); }
    else { b.dataset.armed='1'; b.textContent='Tem certeza? Toque de novo'; }
    return;
  }
  if(!run) return;
  const q = run.qs[run.i];
  if(d.opt!==undefined && !run.done){
    const given = d.opt;
    app.querySelectorAll('.opt').forEach(o=>{o.disabled=true; if(o.dataset.opt===q.ans) o.classList.add('right'); else if(o===b) o.classList.add('wrong');});
    answer(given); return;
  }
  if(d.tile!==undefined && !run.done){
    const j=+d.tile;
    if(q.t==='spell'){ const k=run.slots.indexOf(-1); if(k>=0) run.slots[k]=j; }
    else run.sel.push(j);
    drawBuild(); return;
  }
  if(d.slot!==undefined && !run.done){ run.slots[+d.slot]=-1; drawBuild(); return; }
  if(d.back!==undefined && !run.done){ run.sel.splice(+d.back,1); drawBuild(); return; }
  if(d.act==='clear' && !run.done){ if(q.t==='spell') run.slots.fill(-1); else run.sel=[]; drawBuild(); return; }
  if(d.act==='check' && !run.done){
    const given = q.t==='spell' ? run.slots.map(p=>run.pool[p]).join('') : run.sel.map(p=>run.pool[p]).join(' ');
    const right = given===q.ans;
    run.done=true; drawBuild();
    if(q.t==='spell') app.querySelectorAll('.slot').forEach((s,k)=>s.classList.add(s.textContent===q.ans[k]?'right':'wrong'));
    else $('#ans').classList.add(right?'right':'wrong');
    answer(given); return;
  }
  if(d.act==='next'){ if(run.i<run.qs.length-1){ run.i++; question(); } else result(); scrollTo(0,0); return; }
});
document.addEventListener('keydown', e => {
  if(!run || !run.done) return;
  if(e.key==='Enter'){ const n=app.querySelector('[data-act="next"]'); if(n){ e.preventDefault(); n.click(); } }
});
if(canSpeak){ try{ speechSynthesis.getVoices(); }catch(e){} }
home();
}
</script>
</body></html>
