<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Missão Matemática do Samuel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{
  --bg:#EEF3FF; --paper:#FFFFFF; --ink:#1B2350; --muted:#59618C; --line:#D3DCF6; --rule:rgba(51,85,224,.07);
  --blue:#3355E0; --sun:#F5B10A; --ok:#178F5B; --okbg:#E1F6EA; --bad:#D63A50; --badbg:#FDE6EA;
  --w1:#3355E0; --w2:#E0662A; --w3:#8A4FD8; --w4:#D93D78; --w5:#178F5B; --w6:#0C8EA8; --w7:#4D7F12; --w8:#4B5A78;
  --onaccent:#FFFFFF; --fig:#FFD37A; --fig2:#9DB4FF; --figline:#1B2350;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root{
  --bg:#10152C; --paper:#1A2145; --ink:#EEF1FF; --muted:#A9B1DA; --line:#2F3870; --rule:rgba(124,147,255,.06);
  --blue:#7C93FF; --sun:#FFC94A; --ok:#4FD39A; --okbg:#143A2B; --bad:#FF7A8C; --badbg:#47202B;
  --w1:#6F88FF; --w2:#FF8A4F; --w3:#B286FF; --w4:#FF6FA5; --w5:#3FC98C; --w6:#35C3DE; --w7:#9AD65C; --w8:#A9B9DD;
  --onaccent:#10152C; --fig:#B8862A; --fig2:#4A5FB0; --figline:#EEF1FF; color-scheme:dark }}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule) 31px 32px);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:780px;margin:0 auto;padding-block:18px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.1rem;font-weight:800} h2{font-size:1.6rem;font-weight:800} h3{font-size:1.2rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip .s{color:var(--sun)}
.sub{color:var(--muted);font-weight:700}
.card{background:var(--paper);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.hello{display:flex;flex-direction:column;gap:6px}
.exam{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:var(--onaccent);border-radius:12px;padding:6px 12px;font-weight:800;align-self:flex-start}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.grid{grid-template-columns:1fr}}
.world{background:var(--paper);border:2px solid var(--line);border-bottom:6px solid var(--wc);border-radius:18px;padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden;transition:transform .12s}
.world:hover{transform:translateY(-3px)}
.world .glyph{background:var(--wc);color:var(--onaccent);font-family:var(--display);font-weight:800;font-size:1.9rem;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.world .glyph small{font-family:var(--body);font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.9}
.world .body{padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}
.world .desc{color:var(--muted);font-size:.95rem}
.stars{font-size:1.3rem;letter-spacing:2px;color:var(--line)} .stars .on{color:var(--sun)}
.tipbar{border-left:6px solid var(--sun);background:var(--paper);border-radius:12px;padding:12px 14px;font-weight:700}
.sim{background:var(--ink);color:var(--bg);border:none;border-radius:18px;padding:18px;text-align:left;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.sim h2{color:var(--bg)}
.sim .go{background:var(--sun);color:#1B2350;border-radius:12px;padding:8px 16px;font-family:var(--display);font-weight:800;font-size:1.15rem}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:800;text-decoration:underline;padding:4px 0;align-self:flex-start}
.btn{background:var(--blue);color:var(--onaccent);border:none;border-bottom:4px solid rgba(0,0,0,.25);border-radius:14px;padding:12px 20px;font-family:var(--display);font-weight:800;font-size:1.2rem}
.btn:active{transform:translateY(2px);border-bottom-width:2px}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--line);border-bottom-width:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.back{align-self:flex-start}
.lesson{display:flex;flex-direction:column;gap:12px}
.lesson ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px}
.big{font-family:var(--display);font-weight:800;font-size:1.15rem}
.t{font-weight:800;color:var(--wc,var(--blue))}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{border:2px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top;font-variant-numeric:tabular-nums}
th{font-family:var(--display);font-size:1.05rem}
td.n,th.n{text-align:center}
table.compact{font-size:.85rem} table.compact th,table.compact td{padding:5px 6px} table.compact th{font-size:.9rem}
.alert{background:var(--badbg);border:2px solid var(--bad);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.alert b.h{color:var(--bad);font-family:var(--display);font-size:1.15rem}
.good{background:var(--okbg);border:2px solid var(--ok);border-radius:14px;padding:12px 14px}
.figs{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.figbox{display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.9rem;text-align:center;max-width:100%}
.figbox svg{max-width:100%;height:auto}
.fig{display:flex;justify-content:center;padding:6px 0}
.fig svg{max-width:100%;height:auto}
svg .shape{fill:var(--fig);stroke:var(--figline);stroke-width:2.5;stroke-linejoin:round}
svg .shape2{fill:var(--fig2);stroke:var(--figline);stroke-width:2.5;stroke-linejoin:round}
svg .edge{fill:none;stroke:var(--figline);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
svg .hidden{fill:none;stroke:var(--figline);stroke-width:1.8;stroke-dasharray:5 4;opacity:.7}
svg .gridl{stroke:var(--line);stroke-width:1.5;fill:none}
svg .axis{stroke:var(--bad);stroke-width:3;stroke-dasharray:8 6}
svg .bar{fill:var(--w2)}
svg text{fill:var(--ink);font-family:var(--body);font-weight:800;font-size:13px}
svg .dot{fill:var(--w1)}
svg .letter{fill:none;stroke:var(--figline);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
svg .ghost .letter{stroke:var(--w6);stroke-width:13;opacity:.45}
svg .ghost polygon,svg .ghost rect,svg .ghost circle,svg .ghost ellipse,svg .ghost path{fill:var(--w6);fill-opacity:.25;stroke:var(--w6);stroke-width:3;stroke-dasharray:7 5}
svg .vd{fill:var(--paper);stroke:var(--w4);stroke-width:3;cursor:pointer}
svg .vd.on{fill:var(--w4)}
svg .vn{fill:var(--onaccent);font-size:12px;pointer-events:none}
svg .hit{stroke:transparent;stroke-width:16;cursor:pointer;fill:none}
svg .mk{stroke:var(--bad);stroke-width:5;stroke-linecap:round;pointer-events:none}
svg .cellhit{fill:transparent;cursor:pointer}
svg .cellnum{fill:var(--ink);font-size:13px;pointer-events:none}
svg .cellon{fill:var(--w5);fill-opacity:.35;pointer-events:none}
svg .pc{cursor:pointer}
svg .pc.on > *{stroke:var(--bad);stroke-width:4}
@keyframes rolar{0%{transform:translateX(0) rotate(0)}50%{transform:translateX(60px) rotate(220deg)}100%{transform:translateX(0) rotate(0)}}
@keyframes tombar{0%,100%{transform:rotate(0)}30%{transform:rotate(-12deg)}60%{transform:rotate(8deg)}}
.rola{animation:rolar 1.6s ease-in-out;transform-box:fill-box;transform-origin:center}
.tomba{animation:tombar .9s ease-in-out;transform-box:fill-box;transform-origin:bottom center}
@media (prefers-reduced-motion: reduce){.rola,.tomba{animation:none}}
.prog{height:12px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--wc,var(--blue));border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--muted)}
.combo{color:var(--w2)}
.q{font-family:var(--display);font-weight:700;font-size:1.4rem;line-height:1.25}
.opts{display:grid;gap:10px}
.opt{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:1.05rem}
.opt:hover:not(:disabled){border-color:var(--wc,var(--blue))}
.opt.right{background:var(--okbg);border-color:var(--ok)}
.opt.wrong{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.numrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.numin{width:150px;font:inherit;font-family:var(--display);font-weight:800;font-size:1.8rem;text-align:center;padding:6px 10px;border-radius:14px;border:3px solid var(--line);background:var(--paper);color:var(--ink);font-variant-numeric:tabular-nums}
.numin.right{border-color:var(--ok);background:var(--okbg)} .numin.wrong{border-color:var(--bad);background:var(--badbg)}
.unit{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--muted)}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--okbg);border:2px solid var(--ok)} .fb.no{background:var(--badbg);border:2px solid var(--bad)}
.fb b.h{font-family:var(--display);font-size:1.25rem}
.fb.ok b.h{color:var(--ok)} .fb.no b.h{color:var(--bad)}
.ordrow{min-height:56px;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:6px}
.ordrow .ph{color:var(--muted);font-weight:700;padding:6px}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.piece{background:var(--paper);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-weight:800;text-align:left}
.ordrow .piece{display:flex;gap:10px;align-items:center;width:100%}
.ordrow .piece .n{background:var(--wc,var(--blue));color:var(--onaccent);border-radius:99px;min-width:26px;height:26px;display:inline-grid;place-items:center;font-size:.85rem}
.ordrow .piece.right{border-color:var(--ok);background:var(--okbg)} .ordrow .piece.wrong{border-color:var(--bad);background:var(--badbg)}
.result{align-items:center;text-align:center}
.result .stars{font-size:3rem}
.grade{font-family:var(--display);font-weight:800;font-size:4rem;line-height:1;color:var(--wc,var(--blue));font-variant-numeric:tabular-nums}
.miss-list{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.miss-item{border:2px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.miss-item .c{color:var(--ok);font-weight:800}
.bars{display:flex;flex-direction:column;gap:10px}
.barr{display:grid;grid-template-columns:170px minmax(0,1fr) 54px;gap:10px;align-items:center;font-weight:700}
.barr .track{height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.barr .track i{display:block;height:100%;border-radius:99px}
.barr .v{text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:480px){.barr{grid-template-columns:1fr 54px}.barr .track{grid-column:1/-1;grid-row:2}}
.confetti{position:fixed;top:-12px;width:10px;height:14px;border-radius:2px;z-index:50;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@media (prefers-reduced-motion: reduce){.confetti{display:none}.world{transition:none}}
.foot{color:var(--muted);font-size:.85rem;text-align:center}
.qwrap{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.qmain{flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:12px}
.aid{flex:1 1 300px;max-width:400px;background:var(--bg);border:2px dashed var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.aid h4{margin:0;font-family:var(--display);font-size:1.05rem}
.aid .sub{font-size:.85rem}
.awrap{display:flex;gap:0;align-items:flex-start;overflow-x:auto;padding-bottom:4px}
.ag{display:grid;gap:4px 3px;align-items:center;justify-items:center}
.ab{width:34px;height:40px;text-align:center;font:800 1.35rem var(--display);border:2px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);padding:0;font-variant-numeric:tabular-nums}
.ab.sm{width:26px;height:26px;font-size:.85rem;border-style:dashed;align-self:end}
.ab.ok{border-color:var(--ok);background:var(--okbg)} .ab.bad{border-color:var(--bad);background:var(--badbg)}
.ab.sol{border-color:var(--sun);background:var(--paper);color:var(--muted)}
.ad{width:34px;height:40px;display:grid;place-items:center;font:800 1.35rem var(--display);font-variant-numeric:tabular-nums}
.ad.op{color:var(--muted)}
.ahr{height:0;border-top:3px solid var(--ink);align-self:start;justify-self:stretch;margin-top:-2px}
.chave{display:flex;flex-direction:column;align-items:flex-start;margin-left:6px}
.chave .dv{border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);padding:0 10px 2px 8px;min-width:80px}
.chave .qt{display:flex;gap:3px;padding:6px 0 0 11px}
.chave .lbl{font-size:.72rem;font-weight:800;color:var(--muted);padding-left:11px;text-transform:uppercase;letter-spacing:.04em}
.hints{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.95rem}
@media (max-width:640px){.qwrap.figaid .aid{order:-1;max-width:none}}
.aid .fig{padding:2px 0}
.abtn{background:var(--paper);border:2px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:6px 10px;font-weight:800;font-size:.9rem;color:var(--blue)}
</style></head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ===================== UTILIDADES ===================== */
const app = document.getElementById('app');
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pick(a,n){ return shuffle(a).slice(0,n); }
function rnd(a,b){ return a+Math.floor(Math.random()*(b-a+1)); }
function one(a){ return a[Math.floor(Math.random()*a.length)]; }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function starsHtml(n){ let s=''; for(let i=0;i<3;i++) s+=`<span class="${i<n?'on':''}">★</span>`; return `<span class="stars" aria-label="${n} de 3 estrelas">${s}</span>`; }
function irTopo(){ try{ window.scrollTo({top:0}); }catch(e){} }
const fmtN = n => n.toLocaleString('pt-BR');

/* ===================== DESENHOS (SVG) ===================== */
function svg(w,h,inner,label){ return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" role="img" aria-label="${esc(label||'figura')}">${inner}</svg>`; }
function regPts(n,cx,cy,r,rot){ const p=[]; for(let i=0;i<n;i++){ const a=(rot||-Math.PI/2)+i*2*Math.PI/n; p.push([cx+r*Math.cos(a),cy+r*Math.sin(a)]); } return p; }
const ptsStr = p => p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ');
const SHAPE_DATA = {
  'triângulo': {w:120,h:110,pts:[[60,10],[112,100],[8,100]]},
  'triângulo retângulo': {w:120,h:110,pts:[[15,10],[15,100],[110,100]]},
  'quadrado': {w:120,h:110,pts:[[18,12],[104,12],[104,98],[18,98]]},
  'retângulo': {w:160,h:100,pts:[[10,18],[150,18],[150,86],[10,86]]},
  'paralelogramo': {w:160,h:100,pts:[[40,15],[150,15],[120,88],[10,88]]},
  'trapézio': {w:160,h:100,pts:[[45,15],[115,15],[150,88],[10,88]]},
  'losango': {w:120,h:120,pts:[[60,6],[110,60],[60,114],[10,60]]},
  'pentágono': {w:120,h:115,pts:regPts(5,60,62,52)},
  'hexágono': {w:120,h:110,pts:regPts(6,60,55,50,0)},
  'heptágono': {w:120,h:115,pts:regPts(7,60,60,52)},
  'octógono': {w:120,h:115,pts:regPts(8,60,58,52,-Math.PI/2+Math.PI/8)},
  'círculo': {w:120,h:110,el:'<circle class="shape" cx="60" cy="55" r="48"/>'},
  'oval': {w:160,h:100,el:'<ellipse class="shape" cx="80" cy="50" rx="70" ry="38"/>'},
};
function shapeInner(name){ const d=SHAPE_DATA[name]; return d.pts?`<polygon class="shape" points="${ptsStr(d.pts)}"/>`:d.el; }
const SHAPES = {}; Object.keys(SHAPE_DATA).forEach(k=>{ SHAPES[k]=()=>svg(SHAPE_DATA[k].w,SHAPE_DATA[k].h,shapeInner(k),k); });
function shapeFig(name){ return `<div class="fig">${SHAPES[name]()}</div>`; }

/* sólidos geométricos */
const SOLIDS = {
  cubo: () => svg(130,130,`<polygon class="shape" points="15,40 85,40 85,110 15,110"/><polygon class="shape2" points="15,40 45,15 115,15 85,40"/><polygon class="shape" points="85,40 115,15 115,85 85,110" style="filter:brightness(.88)"/><polyline class="hidden" points="15,110 45,85 115,85"/><line class="hidden" x1="45" y1="85" x2="45" y2="15"/>`,'cubo'),
  paralelepípedo: () => svg(170,110,`<polygon class="shape" points="10,40 130,40 130,100 10,100"/><polygon class="shape2" points="10,40 40,15 160,15 130,40"/><polygon class="shape" points="130,40 160,15 160,75 130,100" style="filter:brightness(.88)"/><polyline class="hidden" points="10,100 40,75 160,75"/><line class="hidden" x1="40" y1="75" x2="40" y2="15"/>`,'paralelepípedo'),
  'pirâmide de base quadrada': () => svg(150,130,`<polygon class="shape2" points="20,105 95,118 130,95"/><polygon class="shape" points="75,10 20,105 95,118"/><polygon class="shape" points="75,10 95,118 130,95" style="filter:brightness(.88)"/><polyline class="hidden" points="20,105 55,85 130,95"/><line class="hidden" x1="55" y1="85" x2="75" y2="10"/>`,'pirâmide de base quadrada'),
  'pirâmide de base triangular': () => svg(140,125,`<polygon class="shape" points="70,10 15,110 95,115"/><polygon class="shape" points="70,10 95,115 128,85" style="filter:brightness(.88)"/><line class="hidden" x1="15" y1="110" x2="128" y2="85"/>`,'pirâmide de base triangular'),
  'prisma de base triangular': () => svg(170,120,`<polygon class="shape2" points="15,105 45,25 75,105"/><polygon class="shape" points="45,25 135,10 165,90 75,105"/><line class="hidden" x1="15" y1="105" x2="105" y2="90"/><line class="hidden" x1="105" y1="90" x2="165" y2="90"/><line class="hidden" x1="105" y1="90" x2="135" y2="10"/>`,'prisma de base triangular'),
  cilindro: () => svg(120,140,`<path class="shape" d="M20,25 L20,115 A40,14 0 0 0 100,115 L100,25"/><ellipse class="shape2" cx="60" cy="25" rx="40" ry="14"/><path class="hidden" d="M20,115 A40,14 0 0 1 100,115"/>`,'cilindro'),
  cone: () => svg(120,140,`<path class="shape" d="M60,10 L18,115 A42,14 0 0 0 102,115 Z"/><path class="hidden" d="M18,115 A42,14 0 0 1 102,115"/>`,'cone'),
  esfera: () => svg(130,130,`<circle class="shape" cx="65" cy="65" r="55"/><path class="hidden" d="M10,65 A55,16 0 0 0 120,65"/>`,'esfera'),
};
function solidFig(name){ return `<div class="fig">${SOLIDS[name]()}</div>`; }

/* planificações: cada peça tem um tipo, para o quadro de contagem */

/* malha quadriculada: cells = [[x,y],...] */
function gridFig(cells, cols, rows, opt){
  opt=opt||{}; const s=opt.s||36, pad=4;
  let g='';
  for(let x=0;x<=cols;x++) g+=`<line class="gridl" x1="${pad+x*s}" y1="${pad}" x2="${pad+x*s}" y2="${pad+rows*s}"/>`;
  for(let y=0;y<=rows;y++) g+=`<line class="gridl" x1="${pad}" y1="${pad+y*s}" x2="${pad+cols*s}" y2="${pad+y*s}"/>`;
  const set=new Set(cells.map(c=>c[0]+','+c[1]));
  let f=cells.map(c=>`<rect x="${pad+c[0]*s}" y="${pad+c[1]*s}" width="${s}" height="${s}" style="fill:var(--fig);stroke:var(--figline);stroke-width:1;stroke-opacity:.35"/>`).join('');
  let b='';
  cells.forEach(([x,y])=>{
    const X=pad+x*s, Y=pad+y*s;
    if(!set.has(x+','+(y-1))) b+=`<line class="edge" x1="${X}" y1="${Y}" x2="${X+s}" y2="${Y}"/>`;
    if(!set.has(x+','+(y+1))) b+=`<line class="edge" x1="${X}" y1="${Y+s}" x2="${X+s}" y2="${Y+s}"/>`;
    if(!set.has((x-1)+','+y)) b+=`<line class="edge" x1="${X}" y1="${Y}" x2="${X}" y2="${Y+s}"/>`;
    if(!set.has((x+1)+','+y)) b+=`<line class="edge" x1="${X+s}" y1="${Y}" x2="${X+s}" y2="${Y+s}"/>`;
  });
  return `<div class="fig">${svg(cols*s+pad*2, rows*s+pad*2, g+f+b, 'figura na malha quadriculada')}</div>`;
}
function areaOf(cells){ return cells.length; }
function perimOf(cells){ const set=new Set(cells.map(c=>c[0]+','+c[1])); let p=0; cells.forEach(([x,y])=>{ [[1,0],[-1,0],[0,1],[0,-1]].forEach(([dx,dy])=>{ if(!set.has((x+dx)+','+(y+dy))) p++; }); }); return p; }
function rectCells(w,h,ox,oy){ const c=[]; for(let y=0;y<h;y++) for(let x=0;x<w;x++) c.push([x+(ox||0),y+(oy||0)]); return c; }

/* disposição retangular de bolinhas */
function dotsFig(rows, cols){
  const s=26, pad=14; let d='';
  for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) d+=`<circle class="dot" cx="${pad+x*s}" cy="${pad+y*s}" r="9"/>`;
  return `<div class="fig">${svg(pad*2+(cols-1)*s, pad*2+(rows-1)*s, d, rows+' linhas com '+cols+' bolinhas')}</div>`;
}

/* gráfico de barras horizontal */
function barChart(title, labels, values, unit){
  const W=360, left=92, top=34, bh=26, gap=12, max=50, sc=(W-left-20)/max;
  const H=top+labels.length*(bh+gap)+30;
  let g=`<text x="${W/2}" y="18" text-anchor="middle" style="font-size:14px">${esc(title)}</text>`;
  for(let v=0;v<=max;v+=5){ const x=left+v*sc; g+=`<line class="gridl" x1="${x}" y1="${top-6}" x2="${x}" y2="${H-24}"/><text x="${x}" y="${H-8}" text-anchor="middle" style="font-size:11px">${v}</text>`; }
  labels.forEach((l,i)=>{ const y=top+i*(bh+gap); g+=`<text x="${left-8}" y="${y+bh/2+5}" text-anchor="end">${esc(l)}</text><rect class="bar" x="${left}" y="${y}" width="${values[i]*sc}" height="${bh}" rx="3"/>`; });
  return `<div class="fig">${svg(W,H,g,title)}</div><p class="sub" style="text-align:center">As linhas do gráfico vão de 5 em 5. Siga o fim da barra até o número de baixo.</p>`;
}

/* ===================== GERADORES ===================== */
const TEMAS = [
  {t:'Animais resgatados no zoológico', it:'animais', lab:['Janeiro','Fevereiro','Março','Abril']},
  {t:'Livros lidos pela turma', it:'livros', lab:['Janeiro','Fevereiro','Março','Abril']},
  {t:'Frutas preferidas da turma', it:'votos', lab:['Banana','Maçã','Uva','Manga']},
];
function genChart(){
  const T = one(TEMAS);
  const vals = shuffle([10,15,20,25,30,35,40,45]).slice(0,4);
  const fig = () => barChart(T.t, T.lab, vals, '');
  const i = rnd(0,3);
  const mx = vals.indexOf(Math.max(...vals)), mn = vals.indexOf(Math.min(...vals));
  const kind = one(['valor','valor','maior','menor','total','dif']);
  if (kind==='valor') return {type:'num', fig, q:`Quantos ${T.it} em ${T.lab[i]}?`, a:vals[i], e:`A barra de ${T.lab[i]} termina no ${vals[i]}. Siga o fim da barra até o número embaixo, com cuidado para não trocar as linhas.`};
  if (kind==='maior') return {type:'mc', fig, q:'Qual teve o MAIOR número?', o:[T.lab[mx], ...T.lab.filter((_,k)=>k!==mx)], e:`A barra mais comprida é a de ${T.lab[mx]}: ${vals[mx]}.`};
  if (kind==='menor') return {type:'mc', fig, q:'Qual teve o MENOR número?', o:[T.lab[mn], ...T.lab.filter((_,k)=>k!==mn)], e:`A barra mais curta é a de ${T.lab[mn]}: ${vals[mn]}.`};
  if (kind==='total') { const s=vals.reduce((a,b)=>a+b,0); return {type:'num', fig, aid:{op:'add',nums:vals}, q:'Qual é o TOTAL somando as quatro barras?', a:s, e:`${vals.join(' + ')} = ${s}. Total = somar todos.`}; }
  return {type:'num', fig, aid:{op:'sub',a:vals[mx],b:vals[mn]}, q:`Quantos a mais ${T.lab[mx]} teve do que ${T.lab[mn]}?`, a:vals[mx]-vals[mn], e:`${vals[mx]} − ${vals[mn]} = ${vals[mx]-vals[mn]}. "Quantos a mais" é subtração.`};
}
function genTabuada(){
  const a = one([6,7,8,9,9,7,8,6,4,5,3]), b = rnd(2,10);
  return {type:'num', q:`${a} × ${b} = ?`, a:a*b, e:`${a} × ${b} = ${a*b}.${a===9?' Truque do 9: '+a+' × '+b+' = '+b+' × 10 − '+b+' = '+(b*10)+' − '+b+' = '+a*b+'.':''}`};
}
function genDobroTriplo(){
  const k = one(['dobro','triplo','metade','terça parte']);
  if (k==='dobro'){ const n=rnd(6,45); return {type:'num', aid:{op:'mult',a:n,b:2}, q:`Qual é o DOBRO de ${n}?`, a:2*n, e:`Dobro = vezes 2: ${n} × 2 = ${2*n} (ou ${n} + ${n}).`}; }
  if (k==='triplo'){ const n=rnd(3,25); return {type:'num', aid:{op:'mult',a:n,b:3}, q:`Qual é o TRIPLO de ${n}?`, a:3*n, e:`Triplo = vezes 3: ${n} × 3 = ${3*n} (ou ${n} + ${n} + ${n}).`}; }
  if (k==='metade'){ const n=2*rnd(4,45); return {type:'num', aid:{op:'div',a:n,b:2}, q:`Qual é a METADE de ${n}?`, a:n/2, e:`Metade = dividir por 2: ${n} ÷ 2 = ${n/2}. Confira: ${n/2} + ${n/2} = ${n}.`}; }
  const n=3*rnd(3,20); return {type:'num', aid:{op:'div',a:n,b:3}, q:`Qual é a TERÇA PARTE de ${n}?`, a:n/3, e:`Terça parte = dividir por 3: ${n} ÷ 3 = ${n/3}. Confira: ${n/3} × 3 = ${n}.`};
}

}

  const a=rnd(12,99), b=rnd(2,5);
  return {type:'num', aid:{op:'mult',a,b}, q:`Arme e efetue: ${a} × ${b} = ?`, a:a*b, e:`${a} × ${b}: primeiro as unidades (${a%10} × ${b} = ${(a%10)*b}), depois as dezenas (${Math.floor(a/10)} × ${b} = ${Math.floor(a/10)*b}), somando o que "vai". Resultado: ${a*b}.`};
}
function genDivExata(){
  const d=rnd(2,9), q=d<=4?rnd(6,24):rnd(2,11);
  return {type:'num', aid:{op:'div',a:d*q,b:d}, q:`${d*q} ÷ ${d} = ?`, a:q, e:`${d*q} ÷ ${d} = ${q}, porque ${q} × ${d} = ${d*q}.`};
}
function genDivResto(){
  const d=rnd(3,6), q=rnd(2,8), r=rnd(1,d-1), n=d*q+r;
  const ok = `${q}, com resto ${r}`;
  const opts = new Set([ok, `${q+1}, com resto 0`, `${q}, com resto ${r===1?2:r-1}`, `${q-1}, com resto ${r+d}`]);
  return {type:'mc', aid:{op:'div',a:n,b:d}, q:`Quanto é ${n} ÷ ${d}?`, o:[...opts], e:`${d} × ${q} = ${d*q}. De ${n} sobram ${r}. O resto (${r}) é menor que o divisor (${d}), então está certo. A divisão não é exata.`};
}

/* ===================== CONTA ARMADA (rascunho de apoio) ===================== */
function digs(n){ return String(n).split(''); }
function buildAid(spec){
  /* devolve {kind, cells:[{r,c,t|id,exp,sm,chk}], lines:[{r,c1,c2}], rows, cols, hints, extra} */
  const cells=[], lines=[], hints=[]; let id=0;
  const inp=(r,c,exp,opt)=>cells.push({r,c,id:'a'+(id++),exp:String(exp),sm:!!(opt&&opt.sm),chk:!(opt&&opt.nochk),lead0:!!(opt&&opt.lead0)});
  const txt=(r,c,t,op)=>cells.push({r,c,t:String(t),op:!!op});
  if (spec.op==='div'){
    const ds=digs(spec.a), b=spec.b, n=ds.length;
    /* passos do algoritmo da chave */
    let i=0, p=+ds[0];
    while (p<b && i<n-1){ i++; p=p*10+ +ds[i]; }
    const steps=[];
    while (true){
      const q=Math.floor(p/b), prod=q*b, r=p-prod;
      steps.push({e:i,p,q,prod,r});
      if (i>=n-1) break;
      i++; p=r*10+ +ds[i];
    }
    ds.forEach((d,k)=>txt(0,k+2,d));
    let row=1;
    steps.forEach((s,k)=>{
      const pd=digs(s.prod), start=s.e-pd.length+1;
      txt(row,start+1,'−',true);
      pd.forEach((d,j)=>inp(row,start+j+2,d));
      lines.push({r:row+1,c1:start+2,c2:s.e+2});
      row++;
      const last=k===steps.length-1;
      const nx = last ? String(s.r) : String(s.r)+ds[s.e+1];
      const end = last ? s.e : s.e+1;
      digs(nx).forEach((d,j)=>inp(row,end-nx.length+1+j+2,d,{lead0: j===0 && nx.length>1 && d==='0'}));
      row++;
      const first = k===0 && s.e>0 ? `O ${ds.slice(0,s.e).join('')} é menor que ${b} (não dá para dividir), então usamos ${s.p}. ` : '';
      hints.push(`${first}Quantas vezes o ${b} cabe em ${s.p}? ${b} × ${s.q} = ${s.prod}. Escreva <b>${s.q}</b> no quociente e ${s.prod} embaixo. ${s.p} − ${s.prod} = ${s.r}.` + (last ? ` Acabou! Resto: <b>${s.r}</b>${s.r===0?' (divisão exata)':''}.` : ` Desça o ${ds[s.e+1]}: fica ${nx.replace(/^0/,'')}.`));
    });
    return {kind:'div', cells, lines, rows:row, cols:n+1, hints, b, q:steps.map(s=>s.q), title:`${spec.a} ÷ ${b}`};
  }
  if (spec.op==='mult'){
    const ad=digs(spec.a), b=spec.b, R=spec.a*spec.b, rd=digs(R), W=Math.max(rd.length, ad.length)+1;
    const col=k=>W-k; /* k = posição a partir da direita (0 = unidades) */
    let carry=0; const carries=[];
    for (let k=0;k<ad.length;k++){ const d=+ad[ad.length-1-k], t=d*b+carry; const last=k===ad.length-1;
      hints.push(`${k===0?'Unidades':k===1?'Dezenas':'Centenas'}: ${d} × ${b} = ${d*b}${carry?` + ${carry} que foi = ${t}`:''}. ${last?`Escreva <b>${t}</b>.`:`Escreva <b>${t%10}</b>${t>=10?` e vai ${Math.floor(t/10)}`:''}.`}`);
      carry=Math.floor(t/10); carries.push(carry);
    }
    carries.slice(0,-1).forEach((c,k)=>{ if(k+1<ad.length) inp(0,col(k+1),c?c:'',{sm:true,nochk:true}); });
    ad.forEach((d,j)=>txt(1,col(ad.length-1-j),d));
    txt(2,col(0)-1>0?1:1,'×',true); txt(2,col(0),b);
    lines.push({r:3,c1:1,c2:W});
    rd.forEach((d,j)=>inp(3,col(rd.length-1-j),d));
    return {kind:'mult', cells, lines, rows:4, cols:W, hints, title:`${spec.a} × ${b}`};
  }
  if (spec.op==='add'){
    const nums=spec.nums, S=nums.reduce((a,b)=>a+b,0), sd=digs(S), W=sd.length+1, col=k=>W-k;
    const maxLen=Math.max(...nums.map(x=>digs(x).length));
    let carry=0;
    for (let k=0;k<maxLen;k++){ const ds=nums.map(x=>Math.floor(x/10**k)%10).filter((d,i)=>digs(nums[i]).length>k); const t=ds.reduce((a,b)=>a+b,0)+carry; const last=k===maxLen-1;
      hints.push(`${k===0?'Unidades':k===1?'Dezenas':'Centenas'}: ${ds.join(' + ')}${carry?` + ${carry} que foi`:''} = ${t}. ${last?`Escreva <b>${t}</b>.`:`Escreva <b>${t%10}</b>${t>=10?` e vai ${Math.floor(t/10)}`:''}.`}`);
      carry=Math.floor(t/10);
      if (!last) inp(0,col(k+1),carry?carry:'',{sm:true,nochk:true});
    }
    nums.forEach((x,i)=>{ const xd=digs(x); xd.forEach((d,j)=>txt(i+1,col(xd.length-1-j),d)); if(i===nums.length-1) txt(i+1,1,'+',true); });
    lines.push({r:nums.length+1,c1:1,c2:W});
    sd.forEach((d,j)=>inp(nums.length+1,col(sd.length-1-j),d));
    return {kind:'add', cells, lines, rows:nums.length+2, cols:W, hints, title:nums.join(' + ')};
  }
  /* sub */
  const a=spec.a, b=spec.b, R=a-b, adg=digs(a), bdg=digs(b), rd=digs(R), W=adg.length+1, col=k=>W-k;
  adg.forEach((d,j)=>txt(0,col(adg.length-1-j),d));
  bdg.forEach((d,j)=>txt(1,col(bdg.length-1-j),d)); txt(1,1,'−',true);
  lines.push({r:2,c1:1,c2:W});
  rd.forEach((d,j)=>inp(2,col(rd.length-1-j),d));
  const ua=a%10, ub=b%10;
  hints.push(ua>=ub ? `Unidades: ${ua} − ${ub} = ${ua-ub}.` : `Unidades: ${ua} é menor que ${ub}. Pegue 1 dezena emprestada: ${ua+10} − ${ub} = ${ua+10-ub}.`);
  if (a>=10){ const da=Math.floor(a/10)-(ua<ub?1:0), db=Math.floor(b/10); hints.push(`Dezenas: ${da} − ${db} = ${da-db}.${ua<ub?' (O '+Math.floor(a/10)+' virou '+da+' porque emprestou 1.)':''}`); }
  return {kind:'sub', cells, lines, rows:3, cols:W, hints, title:`${a} − ${b}`};
}
function aidCellHtml(c, A){
  const st=`grid-row:${c.r+1};grid-column:${c.c}`;
  if (c.t!=null) return `<span class="ad${c.op?' op':''}" style="${st}">${esc(c.t)}</span>`;
  const v = (A.vals[c.id]||'');
  let cls='ab'+(c.sm?' sm':''); let val=v; let dis='';
  if (Q.answered){ dis='disabled'; if (c.chk){ if (v===c.exp || (c.lead0 && v==='')) cls+= v?' ok':''; else { cls+=' sol'; val=c.exp; } } else if(!v && c.exp){ cls+=' sol'; val=c.exp; } }
  else if (A.checked && c.chk && v!==''){ cls += (v===c.exp)?' ok':' bad'; }
  return `<input class="${cls}" style="${st}" inputmode="numeric" maxlength="${c.sm?1:1}" autocomplete="off" aria-label="${c.sm?'vai um':'algarismo'}" data-aid="${c.id}" value="${esc(val)}" ${dis} oninput="aidInput(this)">`;
}
function aidHtml(){
  const A=Q.aid; if(!A) return '';
  if (A.fig) return figAidHtml();
  const M=A.model;
  const colsCss = Array.from({length:M.cols},(_,k)=> (M.kind==='div'&&k===0)?'14px':'34px').join(' ');
  const body = M.cells.map(c=>aidCellHtml(c,A)).join('') + M.lines.map(l=>`<span class="ahr" style="grid-row:${l.r+1};grid-column:${l.c1}/${l.c2+1}"></span>`).join('');
  let grid = `<div class="ag" style="grid-template-columns:${colsCss}">${body}</div>`;
  if (M.kind==='div'){
    const qcells = M.q.map((d,k)=>({id:'q'+k, exp:String(d), chk:true}));
    const qh = qcells.map(c=>{ const v=A.vals[c.id]||''; let cls='ab', val=v; if(Q.answered){ if(v===c.exp) cls+=' ok'; else {cls+=' sol'; val=c.exp;} } else if(A.checked && v!=='') cls+= v===c.exp?' ok':' bad';
      return `<input class="${cls}" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="quociente" data-aid="${c.id}" value="${esc(val)}" ${Q.answered?'disabled':''} oninput="aidInput(this)">`; }).join('');
    grid = `<div class="awrap">${grid}<div class="chave"><div class="dv"><span class="ad">${M.b}</span></div><div class="qt">${qh}</div><span class="lbl">quociente</span></div></div>`;
  } else grid = `<div class="awrap">${grid}</div>`;
  const shown = Q.answered ? M.hints : M.hints.slice(0,A.hint);
  return `<div class="aid" id="aidbox">
    <h4>Rascunho: ${esc(M.title)}</h4>
    <span class="sub">${M.kind==='div'?'Preencha a chave passo a passo.':M.kind==='sub'?'Arme a conta e preencha o resultado.':'Os quadradinhos pontilhados são para o "vai um".'}</span>
    ${grid}
    ${shown.length?`<ol class="hints">${shown.map(h=>`<li>${h}</li>`).join('')}</ol>`:''}
    ${Q.answered?'':`<div class="row">${A.hint<M.hints.length?`<button class="abtn" onclick="aidHint()">Dica do próximo passo</button>`:''}<button class="abtn" onclick="aidCheck()">Conferir a conta</button></div>`}
  </div>`;
}
function aidInput(el){ el.value=el.value.replace(/[^0-9]/g,'').slice(-1); Q.aid.vals[el.dataset.aid]=el.value; if(Q.aid.checked){ Q.aid.checked=false; } el.classList.remove('ok','bad'); }
function refreshAid(){ const box=document.getElementById('aidbox'); if(box) box.outerHTML=aidHtml(); }
function aidHint(){ Q.aid.hint=Math.min(Q.aid.hint+1, Q.aid.model.hints.length); refreshAid(); }
function aidCheck(){ Q.aid.checked=true; refreshAid(); }

  cubo:{v:[[15,40],[85,40],[85,110],[15,110],[45,15],[115,15],[115,85],[45,85]], e:[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]},
  paralelepípedo:{v:[[10,40],[130,40],[130,100],[10,100],[40,15],[160,15],[160,75],[40,75]], e:[[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]]},
  'pirâmide de base quadrada':{v:[[75,10],[20,105],[95,118],[130,95],[55,85]], e:[[1,2],[2,3],[3,4],[4,1],[0,1],[0,2],[0,3],[0,4]]},
  'pirâmide de base triangular':{v:[[70,10],[15,110],[95,115],[128,85]], e:[[1,2],[2,3],[3,1],[0,1],[0,2],[0,3]]},

const SOLID_WH = {cubo:[130,130], paralelepípedo:[170,110], 'pirâmide de base quadrada':[150,130], 'pirâmide de base triangular':[140,125], 'prisma de base triangular':[170,120], cilindro:[120,140], cone:[120,140], esfera:[130,130]};
function solidInner(name){ const s=SOLIDS[name](); return s.slice(s.indexOf('>')+1, s.lastIndexOf('</svg>')); }
function bigSvg(w,h,inner,label,pad,scale){ pad=pad||0; scale=scale||1.35; const W=Math.round((w+2*pad)*scale); return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" width="${W}" style="max-width:100%;height:auto" role="img" aria-label="${esc(label)}">${inner}</svg>`; }
function reflectT(ax){ const [x1,y1,x2,y2]=ax, t=Math.atan2(y2-y1,x2-x1), c=Math.cos(2*t), s=Math.sin(2*t);
  return `translate(${x1} ${y1}) matrix(${c.toFixed(4)} ${s.toFixed(4)} ${s.toFixed(4)} ${(-c).toFixed(4)} 0 0) translate(${-x1} ${-y1})`; }
function gridEdges(cells){ const set=new Set(cells.map(c=>c[0]+','+c[1])), E=[];
  cells.forEach(([x,y])=>{ if(!set.has(x+','+(y-1))) E.push([x,y,x+1,y]); if(!set.has(x+','+(y+1))) E.push([x,y+1,x+1,y+1]); if(!set.has((x-1)+','+y)) E.push([x,y,x,y+1]); if(!set.has((x+1)+','+y)) E.push([x+1,y,x+1,y+1]); });
  return E; }
const A_ = () => Q.aid;
function figMark(id){ const m=A_().marks, i=m.indexOf(id); if(i>=0) m.splice(i,1); else m.push(id); refreshAid(); }
function figMode(md){ A_().mode=md; refreshAid(); }
function figFold(k){ A_().fold = A_().fold===k?null:k; refreshAid(); }
function figClear(){ A_().marks=[]; A_().anim=''; refreshAid(); }
function figRoll(){ A_().anim = A_().anim ? '' : 'go'; refreshAid(); if(A_().anim){ setTimeout(()=>{ if(Q.aid&&Q.aid.anim){ Q.aid.anim='done'; refreshAid(); } },1700); } }
function abtn(label,fn,on){ return `<button class="abtn"${on?' style="background:var(--blue);color:var(--onaccent);border-color:var(--blue)"':''} onclick="${fn}">${label}</button>`; }
function figBox(title, sub, pic, extra){ return `<div class="aid" id="aidbox"><h4>${title}</h4>${sub?`<span class="sub">${sub}</span>`:''}<div class="fig">${pic}</div>${extra||''}</div>`; }
const NOMES_LADOS = `<div class="tblwrap"><table class="compact"><tr><th class="n">Lados</th><th>Nome</th></tr><tr><td class="n">3</td><td>triângulo</td></tr><tr><td class="n">4</td><td>quadrilátero</td></tr><tr><td class="n">5</td><td>pentágono</td></tr><tr><td class="n">6</td><td>hexágono</td></tr><tr><td class="n">7</td><td>heptágono</td></tr><tr><td class="n">8</td><td>octógono</td></tr></table></div>`;

function figAidHtml(){
  const A=Q.aid, sp=A.spec;
  if (sp.op==='vert'){
    const d=SHAPE_DATA[sp.shape];
    let inner=shapeInner(sp.shape);
    if (d.pts) inner += d.pts.map((p,k)=>{ const id='v'+k, i=A.marks.indexOf(id); return `<circle class="vd${i>=0?' on':''}" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="10" onclick="figMark('${id}')"/>${i>=0?`<text class="vn" x="${p[0].toFixed(1)}" y="${(p[1]+4).toFixed(1)}" text-anchor="middle">${i+1}</text>`:''}`; }).join('');
    const pic=bigSvg(d.w,d.h,inner,'figura para marcar as pontas',12);
    let extra = d.pts ? `<p class="big">Pontas marcadas: ${A.marks.length}</p>` : `<p class="sub">Procure as pontas com o dedo. Achou alguma? Esta figura é toda feita de linha curva.</p>`;
    if (d.pts) extra += `<span class="sub">Cada ponta é um vértice. Em todo polígono, nº de lados = nº de vértices.</span>`;
    if (sp.curva) extra += `<div class="good"><b>Polígono</b> = figura fechada feita <b>só de linhas retas</b>. Se tiver linha curva, não é polígono.</div>`;
    if (sp.names) extra += NOMES_LADOS + (d.pts && d.pts.length===4 ? QUADRI : '');
    if (d.pts) extra += `<div class="row">${abtn('Limpar','figClear()')}</div>`;
    return figBox('Quadro de ajuda: conte as pontas', d.pts?'Toque em cada ponta (vértice) da figura. Ela ganha um número.':'', pic, extra);
  }
  if (sp.op==='fold'){
    const d=SHAPE_DATA[sp.shape], ax=sp.axis;
    let inner=shapeInner(sp.shape);
    if (A.fold) inner += `<g class="ghost" transform="${reflectT(ax)}">${shapeInner(sp.shape)}</g>`;
    inner += `<line class="axis" x1="${ax[0]}" y1="${ax[1]}" x2="${ax[2]}" y2="${ax[3]}"/>`;
    const pic=bigSvg(d.w,d.h,inner,'figura com a linha de dobra',35,1.5);
    const msg = A.fold ? `<div class="good">O desenho pontilhado mostra onde a figura vai parar depois de dobrada na linha. Ele ficou <b>exatamente em cima</b> da figura? Se sim, a linha é eixo de simetria. Se sobrou pedaço para fora, não é.</div>` : `<span class="sub">Imagine que a figura é de papel. Dobre na linha vermelha e veja se as duas metades se encaixam.</span>`;
    return figBox('Quadro de ajuda: dobre a figura', '', pic, msg + `<div class="row">${abtn(A.fold?'Desdobrar':'Dobrar na linha','figFold(1)',!!A.fold)}</div>`);
  }
  if (sp.op==='letter'){
    const l=sp.l; let extra='';
    if (A.fold==='v') extra=`<line class="axis" x1="30" y1="-8" x2="30" y2="88"/><g class="ghost" transform="translate(60 0) scale(-1 1)"><path class="letter" d="${LETTERS[l]}"/></g>`;
    if (A.fold==='h') extra=`<line class="axis" x1="-8" y1="40" x2="68" y2="40"/><g class="ghost" transform="translate(0 80) scale(1 -1)"><path class="letter" d="${LETTERS[l]}"/></g>`;
    const pic = bigSvg(90,110,`<g transform="translate(15,15)"><path class="letter" d="${LETTERS[l]}"/>${extra}</g>`,'letra '+l,0,1.5);
    const msg = A.fold ? `<div class="good">A letra azul é a letra depois de dobrada. Ficou <b>em cima</b> da letra preta? Então essa dobra é um eixo de simetria. Teste as duas dobras e conte quantas deram certo.</div>` : `<span class="sub">Teste as duas dobras: em pé (vertical) e deitada (horizontal).</span>`;
    return figBox('Quadro de ajuda: dobre a letra', '', pic, msg + `<div class="row">${abtn('Dobrar em pé','figFold(\'v\')',A.fold==='v')}${abtn('Dobrar deitado','figFold(\'h\')',A.fold==='h')}</div>`);
  }
  if (sp.op==='grid'){
    const s=36, pad=6, cols=sp.cols, rows=sp.rows; let g='';
    for(let x=0;x<=cols;x++) g+=`<line class="gridl" x1="${pad+x*s}" y1="${pad}" x2="${pad+x*s}" y2="${pad+rows*s}"/>`;
    for(let y=0;y<=rows;y++) g+=`<line class="gridl" x1="${pad}" y1="${pad+y*s}" x2="${pad+cols*s}" y2="${pad+y*s}"/>`;
    g += sp.cells.map(([x,y])=>`<rect x="${pad+x*s}" y="${pad+y*s}" width="${s}" height="${s}" style="fill:var(--fig);stroke:var(--figline);stroke-width:1;stroke-opacity:.35"/>`).join('');
    const E=gridEdges(sp.cells);
    g += E.map(([a,b,c,d])=>`<line class="edge" x1="${pad+a*s}" y1="${pad+b*s}" x2="${pad+c*s}" y2="${pad+d*s}"/>`).join('');
    if (sp.mode==='area'){
      g += sp.cells.map(([x,y],k)=>{ const id='c'+k, i=A.marks.indexOf(id); return `${i>=0?`<rect class="cellon" x="${pad+x*s+3}" y="${pad+y*s+3}" width="${s-6}" height="${s-6}" rx="4"/><text class="cellnum" x="${pad+x*s+s/2}" y="${pad+y*s+s/2+5}" text-anchor="middle">${i+1}</text>`:''}<rect class="cellhit" x="${pad+x*s}" y="${pad+y*s}" width="${s}" height="${s}" onclick="figMark('${id}')"/>`; }).join('');
    } else {
      g += E.map(([a,b,c,d],k)=>{ const id='e'+k, on=A.marks.includes(id); return `${on?`<line class="mk" x1="${pad+a*s}" y1="${pad+b*s}" x2="${pad+c*s}" y2="${pad+d*s}"/>`:''}<line class="hit" x1="${pad+a*s}" y1="${pad+b*s}" x2="${pad+c*s}" y2="${pad+d*s}" onclick="figMark('${id}')"/>`; }).join('');
    }
    const pic = `<svg viewBox="0 0 ${cols*s+2*pad} ${rows*s+2*pad}" width="${cols*s+2*pad}" style="max-width:100%;height:auto" role="img" aria-label="malha quadriculada">${g}</svg>`;
    const sub = sp.mode==='area' ? 'Toque em cada quadradinho pintado. Ele ganha um número.' : 'Toque em cada ladinho do contorno (a linha grossa de fora). Ele fica vermelho.';
    const extra = `<p class="big">${sp.mode==='area'?'Quadradinhos contados':'Ladinhos do contorno marcados'}: ${A.marks.length}</p>` +
      `<span class="sub">${sp.mode==='area'?'Atalho no retângulo: linhas × colunas.':'Os ladinhos de dentro da figura não entram no perímetro.'}</span><div class="row">${abtn('Limpar','figClear()')}</div>`;
    return figBox(sp.mode==='area'?'Quadro de ajuda: conte a área':'Quadro de ajuda: dê a volta no contorno', sub, pic, extra);
  }
  if (sp.op==='solid'){
    const n=sp.name, geo=SOLID_GEO[n], wh=SOLID_WH[n];
    const redondo=['cilindro','cone','esfera'].includes(n);
    if (sp.mode==='kind'){
      const cls = A.anim==='go' ? (redondo?'rola':'tomba') : '';
      const pic = wh ? bigSvg(wh[0],wh[1],`<g class="${cls}">${solidInner(n)}</g>`,n,10,1.1) : '';
      const msg = A.anim==='done' ? `<p class="big">${redondo?'Rolou! Tem superfície curva.':'Não rolou, só tombou: todas as faces são planas.'}</p>` : '';
      const tbl = `<div class="tblwrap"><table class="compact"><tr><th>Poliedro</th><th>Corpo redondo</th></tr><tr><td>Só faces planas</td><td>Tem parte curva</td></tr><tr><td>Tem vértices (pontas) e arestas (quinas)</td><td>Pode rolar</td></tr><tr><td>Cubo, paralelepípedo, pirâmide, prisma</td><td>Cilindro, cone, esfera</td></tr></table></div>`;
      return figBox('Quadro de ajuda: teste do rolar', 'Aperte o botão e veja o que acontece quando empurramos o sólido.', pic, msg + `<div class="row">${abtn('Tentar rolar','figRoll()')}</div>` + tbl);
    }
    let pic='', extra='';
    if (geo){
      const md = A.mode || (sp.ask==='a' ? 'a' : 'v');
      let g = solidInner(n);
      if (md==='a') g += geo.e.map(([i,j],k)=>{ const id='e'+k, on=A.marks.includes(id), [x1,y1]=geo.v[i], [x2,y2]=geo.v[j]; return `${on?`<line class="mk" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`:''}<line class="hit" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" onclick="figMark('${id}')"/>`; }).join('');
      else g += geo.v.map(([x,y],k)=>{ const id='v'+k, i=A.marks.indexOf(id); return `<circle class="vd${i>=0?' on':''}" cx="${x}" cy="${y}" r="9" onclick="figMark('${id}')"/>${i>=0?`<text class="vn" x="${x}" y="${y+4}" text-anchor="middle">${i+1}</text>`:''}`; }).join('');
      pic = bigSvg(wh[0],wh[1],g,n,12,1.45);
      const cnt = A.marks.length;
      extra = `<div class="row">${abtn('Marcar vértices','figMode(\'v\');figClear()',md==='v')}${abtn('Marcar arestas','figMode(\'a\');figClear()',md==='a')}${abtn('Limpar','figClear()')}</div>
        <p class="big">${md==='a'?'Arestas marcadas':'Vértices marcados'}: ${cnt}</p>
        <span class="sub">${md==='a'?'Toque em cada linha (quina). As tracejadas ficam escondidas atrás, mas também contam!':'Toque em cada ponta. As pontas escondidas atrás (nas linhas tracejadas) também contam!'}</span>`;
    }
    if (sp.mode==='fva' || !geo){
      extra += `<div class="good"><b>Regras que ajudam:</b><ul class="hints">
        <li><b>Prisma:</b> faces = 2 bases + 1 face para cada lado da base. Vértices = 2 × lados da base. Arestas = 3 × lados da base.</li>
        <li><b>Pirâmide:</b> faces = 1 base + 1 triângulo para cada lado. Vértices = lados da base + 1 (a ponta). Arestas = 2 × lados da base.</li>
        <li>Cubo e paralelepípedo são prismas com 4 lados na base (base quadrada ou retangular).</li>
        <li>Base triangular = 3 lados; quadrada = 4; pentagonal = 5; hexagonal = 6.</li></ul></div>`;
    }
    if (sp.mode==='name'){
      extra += `<ul class="hints"><li><b>Toda redonda</b> = esfera.</li><li><b>2 bases redondas</b> = cilindro.</li><li><b>1 base redonda e uma ponta</b> = cone.</li><li><b>6 faces quadradas</b> = cubo.</li><li><b>6 faces retangulares</b> = paralelepípedo.</li><li><b>Base e triângulos que se encontram numa ponta</b> = pirâmide (o nome da base diz o tipo).</li><li><b>2 bases triangulares iguais</b> = prisma de base triangular.</li></ul>`;
      if (!geo) pic = wh ? bigSvg(wh[0],wh[1],solidInner(n),n,8,1.3) : '';
    }
    return figBox(sp.mode==='fva'?'Quadro de ajuda: conte no sólido':'Quadro de ajuda: pistas do sólido', geo?'Use os botões para escolher o que vai contar.':'', pic, extra);
  }
  if (sp.op==='net'){
    const D=NET_DATA[sp.name];
    const g = D.p.map((pc,k)=>{ const id='p'+k, on=A.marks.includes(id); return `<g class="pc ${netCls(sp.name,pc.t)}${on?' on':''}" onclick="figMark('p${k}')">${pc.el}</g>`; }).join('');
    const pic = bigSvg(D.w,D.h,g,'planificação',6,1.15);
    const tally={}; A.marks.forEach(id=>{ const t=D.p[+id.slice(1)].t; tally[t]=(tally[t]||0)+1; });
    const plural={'quadrado':'quadrados','retângulo':'retângulos','triângulo':'triângulos','círculo':'círculos','leque':'"leques"'};
    const tl = Object.keys(tally).map(t=>`${tally[t]} ${tally[t]>1?plural[t]:(t==='leque'?'"leque"':t)}`).join(', ');
    const extra = `<p class="big">Peças contadas: ${A.marks.length}${tl?` (${tl})`:''}</p><span class="sub">Cada peça vira uma face do sólido quando dobramos o papel.</span>
      <ul class="hints"><li><b>Círculos</b> viram bases redondas: corpo redondo.</li><li><b>Triângulos que se juntam numa ponta</b>: pirâmide.</li><li><b>2 triângulos iguais + retângulos</b>: prisma.</li><li><b>Só quadrados</b>: cubo. <b>Só retângulos</b>: paralelepípedo.</li></ul><div class="row">${abtn('Limpar','figClear()')}</div>`;
    return figBox('Quadro de ajuda: conte as peças', 'Toque em cada peça da planificação. O quadro conta por tipo.', pic, extra);
  }
  if (sp.op==='overlay'){
    const inner = sp.a + (A.fold ? `<g class="ghost" transform="translate(${sp.bx} ${sp.by})">${sp.b}</g>` : '');
    const pic = bigSvg(sp.w,sp.h,inner,'figuras sobrepostas',8,1.5);
    const msg = A.fold ? `<div class="good">A figura pontilhada é a segunda figura colocada em cima da primeira. Elas se encaixaram <b>certinho</b>, sem sobrar nada? Então são congruentes.</div>` : `<span class="sub">Congruentes = mesma forma e mesmo tamanho. Vamos colocar uma em cima da outra?</span>`;
    return figBox('Quadro de ajuda: sobreponha as figuras', '', pic, msg + `<div class="row">${abtn(A.fold?'Separar':'Colocar uma em cima da outra','figFold(1)',!!A.fold)}</div>`);
  }
  return '';
}

/* ===================== DESAFIO ===================== */
let Q = null;
const PRAISE = ['Mandou bem!','Isso aí, Samuel!','Perfeito!','Acertou!','Muito bem!'];
const OOPS = ['Quase! Veja a explicação:','Não foi dessa vez. Vamos entender:','Opa! Olha só:'];
function startWorld(id){ const w=WORLDS.find(x=>x.id===id); startQuiz(w.build(), {world:id, cor:w.cor, nome:w.nome}); }
function startSim(){ startQuiz(buildSimulado(), {sim:true, cor:'--w1', nome:'Simulado da prova'}); }
function startQuiz(items, ctx){ Q = {items, i:0, score:0, combo:0, wrong:[], ctx}; initItem(); renderQ(); }
function initItem(){
  const it = Q.items[Q.i];
  Q.answered=false; Q.lastOk=null; Q.optPicked=null; Q.sel=[]; Q.numVal='';
  Q.aid = it.aid ? (FIG_OPS.has(it.aid.op) ? {spec:it.aid, fig:true, marks:[], mode:null, fold:null, anim:''} : {model:buildAid(it.aid), vals:{}, hint:0, checked:false}) : null;
  if (it.type==='mc') Q.opts = shuffle(it.o);
  if (it.type==='order') Q.pool = shuffle(it.items);
}
function renderQ(){
  const it = Q.items[Q.i], n=Q.items.length;
  const body = it.type==='mc' ? mcHtml(it) : it.type==='num' ? numHtml(it) : orderHtml(it);
  app.innerHTML = `
    <div class="row" style="justify-content:space-between">
      <button class="btn ghost back" onclick="renderHome()">← Sair</button>
      <span class="chip">${Q.score} acertos</span>
    </div>
    <div class="card" style="--wc:var(${Q.ctx.cor})">
      <div class="qhead"><span>${Q.ctx.nome} · ${Q.i+1} de ${n}</span>${Q.combo>=3?`<span class="combo">${Q.combo} seguidas!</span>`:''}</div>
      <div class="prog"><i style="width:${Math.round(Q.i/n*100)}%"></i></div>
      ${it.fig && !(Q.aid&&Q.aid.fig)?it.fig():''}
      ${Q.aid?`<div class="qwrap${Q.aid.fig?' figaid':''}"><div class="qmain">${body}</div>${aidHtml()}</div>`:body}
    </div>`;
  if (it.type==='num' && !Q.answered){ const inp=document.getElementById('numin'); if(inp){ try{inp.focus({preventScroll:true});}catch(e){} } }
}
function fbHtml(ok, exp, extra){
  return `<div class="fb ${ok?'ok':'no'}"><b class="h">${ok?one(PRAISE):one(OOPS)}</b>${extra||''}<span>${exp||''}</span></div>
    <div class="row"><button class="btn" id="nextbtn" onclick="nextQ()">${Q.i+1<Q.items.length?'Próxima →':'Ver resultado'}</button></div>`;
}
function mcHtml(it){
  const opts = Q.opts.map((o,i)=>{
    let c='opt';
    if (Q.answered){ if(o===it.o[0]) c+=' right'; else if(i===Q.optPicked) c+=' wrong'; }
    return `<button class="${c}" ${Q.answered?'disabled':''} onclick="answerMC(${i})">${esc(o)}</button>`;
  }).join('');
  return `<p class="q">${esc(it.q)}</p><div class="opts">${opts}</div>${Q.answered?fbHtml(Q.lastOk, it.e, Q.lastOk?'':`<span>Resposta certa: <b>${esc(it.o[0])}</b></span>`):''}`;
}
function answerMC(i){
  if (Q.answered) return;
  const it=Q.items[Q.i]; Q.optPicked=i;
  record(it, Q.opts[i]===it.o[0], it.q, it.o[0]);
  renderQ(); focusNext();
}
function numHtml(it){
  const cls = Q.answered ? (Q.lastOk?' right':' wrong') : '';
  return `<p class="q">${esc(it.q)}</p>
    <form class="numrow" onsubmit="event.preventDefault();answerNum()">
      <input id="numin" class="numin${cls}" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="Sua resposta" value="${esc(Q.numVal)}" ${Q.answered?'disabled':''} oninput="Q.numVal=this.value">
      ${it.unit?`<span class="unit">${esc(it.unit)}</span>`:''}
      ${Q.answered?'':'<button class="btn" type="submit">Conferir</button>'}
    </form>
    ${Q.answered?fbHtml(Q.lastOk, it.e, Q.lastOk?'':`<span>Resposta certa: <b>${fmtN(it.a)}${it.unit?' '+esc(it.unit):''}</b></span>`):''}`;
}
function answerNum(){
  if (Q.answered) return;
  const it=Q.items[Q.i];
  const raw=(Q.numVal||'').replace(/[^0-9]/g,'');
  if (!raw){ const inp=document.getElementById('numin'); if(inp) inp.focus(); return; }
  record(it, parseInt(raw,10)===it.a, it.q, fmtN(it.a)+(it.unit?' '+it.unit:''));
  renderQ(); focusNext();
}
function orderHtml(it){
  const placed = Q.sel.map((x,k)=>{ let c='piece'; if (Q.answered) c += x===it.items[k]?' right':' wrong';
    return `<button class="${c}" ${Q.answered?'disabled':''} onclick="unpick(${k})"><span class="n">${k+1}</span>${esc(x)}</button>`; }).join('');
  const pool = Q.pool.map((x,k)=>Q.sel.includes(x)?'':`<button class="piece" onclick="pickPiece(${k})">${esc(x)}</button>`).join('');
  let html = `<p class="q">${esc(it.q)}</p><p class="sub">Toque nas peças na ordem certa. Para tirar uma peça, toque nela de novo.</p>
    <div class="ordrow">${placed || '<span class="ph">Sua sequência aparece aqui</span>'}</div>${Q.answered?'':`<div class="pool">${pool}</div>`}`;
  if (!Q.answered && Q.sel.length===it.items.length) html += `<div class="row"><button class="btn" onclick="checkOrder()">Conferir</button></div>`;
  if (Q.answered) html += fbHtml(Q.lastOk, it.e, Q.lastOk?'':`<span>Ordem certa: <b>${it.items.map(esc).join(' → ')}</b></span>`);
  return html;
}
function pickPiece(k){ if(Q.answered) return; const x=Q.pool[k]; if(x!=null && !Q.sel.includes(x)) Q.sel.push(x); renderQ(); }
function unpick(k){ if(Q.answered) return; Q.sel.splice(k,1); renderQ(); }
function checkOrder(){ const it=Q.items[Q.i]; record(it, Q.sel.every((x,k)=>x===it.items[k]), it.q, it.items.join(' → ')); renderQ(); focusNext(); }
function record(it, ok, label, correct){
  Q.answered=true; Q.lastOk=ok;
  const t = S.topics[it.topic] || (S.topics[it.topic]={ok:0,total:0});
  t.total++;
  if (ok){ t.ok++; Q.score++; Q.combo++; S.xp += 10 + (Q.combo>=3?5:0); }
  else { Q.combo=0; const key=`[${TOPIC_NAMES[it.topic]}] ${label}`; S.missed[key]=(S.missed[key]||0)+1; Q.wrong.push({label, correct, exp:it.e}); }
  save();
}
function focusNext(){ const b=document.getElementById('nextbtn'); if(b){ try{ b.focus({preventScroll:true}); b.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} } }
function nextQ(){ Q.i++; if (Q.i>=Q.items.length) return finish(); initItem(); renderQ(); irTopo(); }

/* ===================== RESULTADO ===================== */
function finish(){
  const n=Q.items.length, p=Q.score/n;
  const stars = p>=0.9?3:p>=0.7?2:p>=0.5?1:0;
  let head='';
  if (Q.ctx.world){
    const r = S.worlds[Q.ctx.world] || (S.worlds[Q.ctx.world]={stars:0,best:0,plays:0});
    r.plays++; r.stars=Math.max(r.stars,stars); r.best=Math.max(r.best,Math.round(p*100));
    head = `${starsHtml(stars)}<h2>${stars===3?'Mundo dominado!':stars===2?'Muito bom!':stars===1?'Bom começo!':'Vamos treinar mais um pouco!'}</h2>
      <p class="sub">Você acertou ${Q.score} de ${n}.${stars<3?' Faça 9 ou 10 acertos para ganhar 3 estrelas.':''} As contas mudam a cada partida.</p>`;
  } else {
    const nota = p*10; S.simCount=(S.simCount||0)+1; S.simBest = S.simBest==null?nota:Math.max(S.simBest,nota);
    head = `<span class="sub">Sua nota no simulado</span><span class="grade">${fmt(nota)}</span>
      <h2>${nota>=9?'Pronto para a prova!':nota>=7?'Muito bem! Revise os erros abaixo.':'Vamos revisar e tentar de novo!'}</h2>
      <p class="sub">Você acertou ${Q.score} de ${n}.</p>`;
  }
  save();
  const wrong = Q.wrong.length ? `<div class="miss-list"><h3>Para revisar</h3>${Q.wrong.map(w=>`
      <div class="miss-item"><span><b>${esc(w.label)}</b></span><span class="c">Certo: ${esc(w.correct)}</span>${w.exp?`<span class="sub" style="font-weight:600">${w.exp}</span>`:''}</div>`).join('')}</div>` : '<div class="good" style="width:100%">Nenhum erro. Gabaritou!</div>';
  app.innerHTML = `
    <div class="card result" style="--wc:var(${Q.ctx.cor})">
      ${head}
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="${Q.ctx.world?`startWorld('${Q.ctx.world}')`:'startSim()'}">Jogar de novo</button>
        <button class="btn ghost" onclick="renderHome()">Voltar ao mapa</button>
      </div>
      ${wrong}
    </div>`;
  irTopo();
  if (stars===3 || (Q.ctx.sim && p>=0.9)) confetti();
}
function confetti(){
  try{ if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const cols=['--w1','--w2','--w3','--w4','--w5','--w6','--sun'];
  for(let i=0;i<60;i++){ const d=document.createElement('div'); d.className='confetti'; d.style.left=Math.random()*100+'vw'; d.style.background=`var(${cols[i%cols.length]})`; d.style.animationDelay=(Math.random()*0.6)+'s'; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
}

/* ===================== PAINEL DA FAMÍLIA ===================== */
let resetArmed=false;
function renderParents(){
  resetArmed=false;
  const bars = Object.keys(TOPIC_NAMES).map(k=>{
    const t=S.topics[k]; const p = t&&t.total ? t.ok/t.total : null;
    const col = p==null?'var(--line)':p>=0.8?'var(--ok)':p>=0.6?'var(--sun)':'var(--bad)';
    return `<div class="barr"><span>${TOPIC_NAMES[k]}</span><span class="track"><i style="width:${p==null?0:Math.round(p*100)}%;background:${col}"></i></span><span class="v">${p==null?'–':Math.round(p*100)+'%'}</span></div>`;
  }).join('');
  const missed = Object.entries(S.missed).sort((a,b)=>b[1]-a[1]).slice(0,10);
  const ul = s => `<ul style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px">${s}</ul>`;
  app.innerHTML = `
    <button class="btn ghost back" onclick="renderHome()">← Mapa</button>
    <div class="card"><h2>Painel da família</h2>
      <p class="sub">Acertos por assunto (verde a partir de 80%). Simulados feitos: ${S.simCount||0}${S.simBest!=null?` · melhor nota: ${fmt(S.simBest)}`:''}.</p>
      <div class="bars">${bars}</div></div>
    <div class="card"><h3>O que ele mais errou no jogo</h3>
      ${missed.length?`<div class="miss-list">${missed.map(([k,v])=>`<div class="miss-item"><span>${esc(k)}</span><span class="sub">${v} ${v>1?'vezes':'vez'}</span></div>`).join('')}</div>`:'<p class="sub">Ainda sem erros registrados. Eles aparecem aqui depois que ele jogar.</p>'}</div>
    <div class="card"><h3>O que o livro de atividades mostrou</h3>${ul(`
      <li><b>Gráfico de barras (cap. 7, p. 88):</b> trocou os valores de fevereiro (35) e março (15) e somou o total como 60. O certo é 120.</li>
      <li><b>Tabela do zoológico (p. 89):</b> em "elefante ou girafa" respondeu "6 ou 7". O certo é somar: 13.</li>
      <li><b>Roleta (p. 89):</b> disse que a girafa tinha mais chance. Com partes iguais, todos têm a mesma chance.</li>
      <li><b>Ração (p. 91):</b> problema de 2 passos: escreveu 66 kg e 120 animais. Certo: 60 kg e 30 animais.</li>
      <li><b>Polígonos (cap. 8, p. 247):</b> escreveu que o triângulo tem 2 vértices. São 3.</li>
      <li><b>Sólidos (cap. 9, p. 36):</b> chamou a caixa de sapato de "retângulo". O sólido é paralelepípedo.</li>
      <li><b>Pista de corrida (p. 116):</b> somou só 2 lados (40 m). O perímetro é 80 m, e por isso 4 voltas deram 160 em vez de 320.</li>
      <li><b>Lápis em mm (p. 115):</b> 20 cm virou 210 mm e 15 cm virou 160 mm. Certo: 200 e 150 (vezes 10).</li>
      <li><b>Teia do conhecimento (cap. 7, p. 190):</b> trocou "frequência" por "multiplicar" e "gráficos" por "tabelas".</li>
      <li>Foi muito bem em: faces, vértices e arestas dos sólidos e pirâmides, área na malha, perímetro de canteiros e da praça, conversão de metros e quilômetros, letras do RINOCERONTE.</li>`)}</div>
    <div class="card"><h3>O que as fichas mostraram</h3>${ul(`
      <li><b>Ficha 20:</b> todas as contas armadas certas, mas na tabuada escreveu 9 × 9 = 82. A tabuada do 9 merece um treino.</li>
      <li><b>Ficha 20:</b> a resposta "metade de 56 = 28" foi marcada errada por causa da conta armada. Vale rever a divisão armada com resto parcial.</li>
      <li><b>Ficha 22:</b> calculou os totais das lojas, mas marcou a alternativa errada. Certo: a loja 3 é 10 reais mais barata que a loja 1.</li>
      <li><b>Ficha 22:</b> perímetro de 10 m por 2 m deu 24 (certo), mas escreveu "cm" no lugar de "m".</li>
      <li>Fichas 19 e 21 sem erros: sólidos, nomes de polígonos, simetria da borboleta, área e perímetro.</li>`)}</div>
    <div class="card"><h3>Para a noite antes da prova</h3>${ul(`
      <li>Peça para ele dizer a tabuada do 9 de cabeça, com o truque "× 10 e tira um".</li>
      <li>Desenhe um retângulo com medidas e peça o perímetro em voz alta, apontando os 4 lados.</li>
      <li>Mostre uma caixa, uma lata e uma bola e peça o nome do sólido e se é poliedro ou corpo redondo.</li>
      <li>Leia uma pergunta de problema e peça para ele dizer qual conta vai fazer antes de calcular.</li>
      <li>Faça um simulado só no final, para ele dormir com uma nota boa na cabeça.</li>`)}</div>
    <button class="btn ghost" id="resetbtn" style="align-self:flex-start" onclick="resetAll()">Apagar o progresso</button>`;
  irTopo();
}
function resetAll(){
  const b=document.getElementById('resetbtn');
  if(!resetArmed){ resetArmed=true; b.textContent='Toque de novo para confirmar'; return; }
  S={xp:0, worlds:{}, topics:{}, missed:{}, simBest:null, simCount:0}; save(); renderHome();
}
renderHome();
</script>
</body></html>
