/* palavras que o Samuel errou nas fichas: aparecem com mais frequência */
const FOCO = ['so-*fá','ca-*fé','ma-te-*má-ti-ca','pa-*pel','*ár-vo-re','*lâm-pa-da','ja-ca-*ré','*pás-sa-ro'];
function parseWord(s){
  const parts = s.split('-'); const t = parts.findIndex(p => p.startsWith('*'));
  const syl = parts.map(p => p.replace('*',''));
  const fe = syl.length - t;
  return { syl, t, word: syl.join(''), cls: fe===1?'oxítona':fe===2?'paroxítona':'proparoxítona' };
}
const POSNAME = fe => fe===1?'última':fe===2?'penúltima':fe===3?'antepenúltima':'';

 {q:'O que é a sílaba tônica?', o:['A sílaba falada com mais força','A primeira sílaba da palavra','A sílaba que sempre tem acento','A última letra da palavra'], e:'Sílaba tônica é a mais forte. Ela pode estar em qualquer lugar e nem sempre tem acento: em "boneca", a tônica é NE.'},
 {q:'Nas palavras OXÍTONAS, a sílaba mais forte é a...', o:['Última sílaba','Primeira sílaba','Penúltima sílaba','Antepenúltima sílaba'], e:'Oxítona = a ÚLTIMA sílaba é a forte: ca-FÉ, so-FÁ, a-ba-ca-XI. Não é a primeira!'},
 {q:'Nas palavras PAROXÍTONAS, a sílaba mais forte é a...', o:['Penúltima sílaba','Última sílaba','Primeira sílaba sempre','Antepenúltima sílaba'], e:'Paroxítona = PENÚLTIMA (2ª contando do fim): bo-NE-ca, es-CO-la, ja-NE-la.'},
 {q:'Nas palavras PROPAROXÍTONAS, a sílaba mais forte é a...', o:['Antepenúltima sílaba','Última sílaba','Penúltima sílaba','Sílaba do meio sempre'], e:'Proparoxítona = ANTEPENÚLTIMA (3ª contando do fim): MÉ-di-co, PÁS-sa-ro.'},
 {q:'Complete: todas as palavras proparoxítonas são...', o:['acentuadas','oxítonas','monossílabas','sem acento'], e:'Regra de ouro: TODA proparoxítona tem acento. Médico, pássaro, lâmpada, matemática.'},
 {q:'Qual palavra é proparoxítona?', o:['lâmpada','janela','café','papel'], e:'LÂM-pa-da: a sílaba forte é a 3ª contando do fim.'},
 {q:'Qual destes grupos tem SÓ palavras oxítonas?', o:['café, sofá, jacaré','casa, bola, menino','médico, música, pássaro','escola, caderno, janela'], e:'ca-FÉ, so-FÁ, ja-ca-RÉ: todas com a última sílaba forte.'},
 {q:'Como se separa "abacaxi" em sílabas?', o:['a-ba-ca-xi','ab-a-ca-xi','a-bac-a-xi','aba-ca-xi'], e:'a-ba-ca-xi tem 4 sílabas. A forte é XI, a última. Então é oxítona.'},
 {q:'A palavra "matemática" é...', o:['proparoxítona','paroxítona','oxítona','monossílaba'], e:'ma-te-MÁ-ti-ca. Contando do fim: ca (1), ti (2), MÁ (3). 3ª do fim = proparoxítona.'},
 {q:'A palavra "papel" é...', o:['oxítona','paroxítona','proparoxítona','monossílaba'], e:'pa-PEL: a última sílaba é a forte. É oxítona, mesmo sem acento.'},
 {q:'A palavra "sofá" é...', o:['oxítona','paroxítona','proparoxítona','monossílaba'], e:'so-FÁ: a forte é a última. O acento já mostra onde está a força.'},
 {q:'Quantas sílabas tem a palavra "caderno"?', o:['3','2','4','5'], e:'ca-der-no: 3 sílabas. A forte é DER, a penúltima: paroxítona.'},
 {q:'Qual destas palavras é paroxítona com acento?', o:['lápis','café','pássaro','sofá'], e:'LÁ-pis é paroxítona e tem acento porque termina em "is". A maioria das paroxítonas não tem acento.'},
 {q:'Qual palavra é paroxítona?', o:['escola','jacaré','médico','abacaxi'], e:'es-CO-la: a forte é a penúltima.'}
],
oxitona: [
 {q:'Qual oxítona está escrita SEM o acento que precisa?', o:['sofa','caju','amor','papel'], e:'"sofá" termina em A, então leva acento. Caju (u), amor (r) e papel (l) não levam.'},
 {q:'Qual é a escrita correta?', o:['jacaré','jacare','jácare','jacarê'], e:'ja-ca-RÉ: oxítona terminada em E leva acento. O som é aberto, então o acento é agudo (´).'},
 {q:'Por que "café" tem acento?', o:['Porque é oxítona terminada em E','Porque é proparoxítona','Porque tem duas sílabas','Porque começa com C'], e:'Oxítonas terminadas em A, E, O, EM e ENS (com ou sem S) levam acento.'},
 {q:'Qual destas oxítonas NÃO leva acento?', o:['abacaxi','cipó','também','parabéns'], e:'"abacaxi" termina em I. Oxítona terminada em I, U, R, L ou Z não leva acento.'},
 {q:'"Parabéns" leva acento porque é oxítona terminada em...', o:['ENS','A','I','R'], e:'para-BÉNS: oxítona terminada em ENS leva acento.'},
 {q:'Qual é a escrita correta?', o:['vovô','vovo','vóvo','vôvo'], e:'vo-VÔ: oxítona terminada em O. Som fechado, acento circunflexo (^).'},
 {q:'Quais terminações fazem as oxítonas levarem acento?', o:['A, E, O, EM, ENS (com ou sem S)','I, U, R, L','Todas as terminações','Nenhuma, oxítona nunca tem acento'], e:'A regra: A(s), E(s), O(s), EM e ENS. Exemplos: sofá, café, cipó, também, parabéns.'},
 {q:'"Picolé", "maracujá" e "jiló" têm em comum que são...', o:['oxítonas com acento','proparoxítonas','monossílabos','paroxítonas'], e:'pi-co-LÉ, ma-ra-cu-JÁ, ji-LÓ: a última sílaba é a forte, e terminam em E, A, O.'},
 {q:'Qual palavra é oxítona?', o:['Café','Cadeira','Médico','Escola'], e:'ca-FÉ: última sílaba forte. Cadeira e escola são paroxítonas; médico é proparoxítona.'},
 {q:'Em qual palavra a ÚLTIMA sílaba é a mais forte?', o:['Abacaxi','Árvore','Lápis','Boneca'], e:'a-ba-ca-XI. Árvore é proparoxítona, lápis e boneca são paroxítonas.'},
 {q:'Qual frase está escrita corretamente?', o:['O bebê dormiu no sofá.','O bebe dormiu no sofa.','O bébe dormiu no sófa.','O bêbe dormiu no sofá.'], e:'be-BÊ e so-FÁ são oxítonas terminadas em E e A: as duas levam acento na última sílaba.'},
 {q:'Toda palavra oxítona tem acento?', o:['Não. Amor, papel e caju são oxítonas sem acento.','Sim, todas têm.','Só as que têm 3 sílabas.','Só as que começam com vogal.'], e:'Só levam acento as terminadas em A, E, O, EM, ENS. A-MOR, pa-PEL, ca-JU são oxítonas sem acento.'},
 {q:'"Ninguém" leva acento porque é oxítona terminada em...', o:['EM','ENS','I','U'], e:'nin-GUÉM termina em EM, então leva acento. O mesmo vale para "também" e "alguém".'},
 {q:'Todas estas palavras estão sem acento. Qual delas PRECISA de acento?', o:['cipo','tatu','jardim','rapaz'], e:'O certo é ci-PÓ: oxítona terminada em O leva acento. Tatu (u), jardim (im) e rapaz (z) não levam.'},
 {q:'No poema do livro, por que "tamanduá" tem acento?', o:['É oxítona terminada em A','É proparoxítona','É monossílabo','Termina em U'], e:'ta-man-du-Á: a última sílaba é a forte e termina em A.'},
 {q:'Qual destas oxítonas do livro NÃO tem acento?', o:['azul','sabiá','jiló','bebê'], e:'a-ZUL termina em L. Sabiá (a), jiló (o) e bebê (e) levam acento.'},
 {q:'"Peru", "anel" e "especial" são oxítonas. Por que não têm acento?', o:['Porque terminam em U e L','Porque são paroxítonas','Porque são palavras pequenas','Porque têm a letra E'], e:'Só levam acento as oxítonas terminadas em A, E, O (com ou sem S), EM e ENS.'},
 {q:'No livro, "bajulador" é o exemplo de palavra...', o:['oxítona','paroxítona','proparoxítona','monossílaba'], e:'ba-ju-la-DOR: a última sílaba é a tônica. Ela não tem acento porque termina em R.'},
 {q:'No livro, "raposa" é o exemplo de palavra...', o:['paroxítona','oxítona','proparoxítona','monossílaba'], e:'ra-PO-sa: a penúltima sílaba é a tônica.'},
 {q:'No livro, "fábula" é o exemplo de palavra...', o:['proparoxítona','paroxítona','oxítona','monossílaba'], e:'FÁ-bu-la: a antepenúltima sílaba é a tônica. E toda proparoxítona tem acento.'},
 {q:'Qual verso do poema do livro tem uma oxítona acentuada terminada em E?', o:['O bicho-preguiça toma café','O caracol anda devagar','Porque sua casa precisa carregar','Pra encher sua barriga'], e:'ca-FÉ: oxítona terminada em E. No poema também aparecem chulé e tamanduá.'}
],
mono: [
 {q:'O que é uma palavra monossílaba?', o:['Palavra que tem só uma sílaba','Palavra com duas sílabas','Palavra que sempre tem acento','Palavra muito comprida'], e:'Mono = um. Pé, sol, céu, nó e flor têm uma sílaba só.'},
 {q:'Qual destas palavras é monossílaba?', o:['pé','café','bola','sapato'], e:'"pé" tem uma sílaba só. Café (ca-fé) tem duas.'},
 {q:'Qual monossílabo precisa de acento?', o:['pe (pé)','sol','flor','mar'], e:'Monossílabos fortes terminados em A, E, O levam acento: pé. Sol, flor e mar terminam em L e R.'},
 {q:'Qual é a escrita correta?', o:['três','tres','trés','trêz'], e:'"três" é monossílabo forte terminado em E + S. Som fechado: acento circunflexo (^).'},
 {q:'Qual é a escrita correta para "o mês de dezembro"?', o:['mês','mes','més','mêz'], e:'"mês" termina em E + S e é falado com força. Leva acento circunflexo.'},
 {q:'"Dei um ___ no cadarço." Qual palavra completa?', o:['nó','no','nô','nõ'], e:'"nó" (o laço) é monossílabo forte terminado em O: leva acento agudo.'},
 {q:'Por que "sol" NÃO tem acento?', o:['Porque termina em L, e não em A, E ou O','Porque é uma palavra grande','Porque é oxítona','Porque o sol é quente'], e:'A regra só acentua monossílabos fortes terminados em A, E, O (com ou sem S).'},
 {q:'Qual grupo está todo acentuado corretamente?', o:['pá, pé, pó','pa, pé, pó','pá, pe, po','pà, pè, pò'], e:'pá, pé, pó: monossílabos fortes terminados em A, E, O.'},
 {q:'"Ele ___ um presente para a mãe." Qual palavra completa?', o:['dá','da','dã','dâ'], e:'Aqui "dá" é o verbo dar, falado com força: leva acento. "da" sem acento é fraco, como em "casa da vovó".'},
 {q:'"O céu ___ azul." Qual palavra completa?', o:['é','e','ê','è'], e:'"é" (verbo ser) é forte e tem acento. "e" sem acento junta palavras: "pão e leite".'},
 {q:'Qual destas palavras NÃO precisa de acento?', o:['luz','já','nós','só'], e:'"luz" termina em Z. Já, nós e só terminam em A e O e levam acento.'},
 {q:'"Vovó tomou ___ de camomila." Qual palavra completa?', o:['chá','cha','chã','châ'], e:'"chá" é monossílabo forte terminado em A: leva acento.'},
 {q:'"Céu" leva acento porque...', o:['tem o som aberto "éu"','tem duas sílabas','é proparoxítona','termina em L'], e:'Monossílabos com som aberto éu, éi, ói também levam acento: céu, véu, dói.'},
 {q:'Quantas sílabas tem a palavra "flor"?', o:['1','2','3','4'], e:'"flor" é monossílaba: uma sílaba só, e sem acento porque termina em R.'},
 {q:'Segundo o livro, quais monossílabos levam acento?', o:['Os tônicos terminados em A, AS, E, ES, O, OS','Todos os monossílabos','Só os que têm a letra R','Os terminados em L'], e:'Exemplos do livro: pá, lá, cá, gás, pé, fé, três, pó, só, xô, nós.'},
 {q:'O carteiro precisa seguir o caminho em que TODOS os monossílabos levam acento. Qual é?', o:['pé, gás, três, ré, chá','pó, só, flor, mar, fé','má, lá, dor, mês, bom','sol, mar, flor, luz, mel'], e:'pé, gás, três, ré e chá terminam em E, AS, ES, E, A. Flor, mar, dor e bom não levam acento.'},
 {q:'"___! Sai daqui, gato!" Qual palavra completa?', o:['Xô','Xo','Xõ','Xó'], e:'"xô" é monossílabo tônico terminado em O: leva acento circunflexo.'},
 {q:'"O fogão funciona a ___." Qual palavra completa?', o:['gás','gas','gãs','gaz'], e:'"gás" termina em AS e é tônico: leva acento.'},
 {q:'Mel, chá, pé e pó: o que essas palavras têm em comum?', o:['Todas têm uma só sílaba','Todas têm acento','Todas são proparoxítonas','Todas têm duas sílabas'], e:'São monossílabos. Mas atenção: mel não tem acento, porque termina em L.'}
],
carta: [
 {t:'carta', q:'Quem escreveu a carta (o remetente)?', o:['Theo','Vovó Lia','O papai','A professora'], e:'Remetente é quem ENVIA. Theo assinou no final.'},
 {t:'carta', q:'Para quem a carta foi escrita (o destinatário)?', o:['Para a vovó Lia','Para o papai','Para a turma','Para o Theo'], e:'Destinatário é quem RECEBE. A saudação "Querida vovó Lia" mostra para quem é.'},
 {t:'carta', q:'"Querida vovó Lia," é qual parte da carta?', o:['Saudação','Despedida','Assinatura','Local e data'], e:'A saudação (ou vocativo) é o cumprimento, chamando quem vai ler.'},
 {t:'carta', q:'Qual é o principal motivo da carta?', o:['Contar novidades e dizer que sente saudade','Pedir dinheiro emprestado','Explicar uma receita de bolo','Vender um feijão'], e:'Theo conta o que fez na escola e na praia e diz que está com saudade.'},
 {t:'carta', q:'O que significa "P.S." no final da carta?', o:['Um recado lembrado depois da assinatura','O nome da cidade','A data em que a carta chegou','O endereço da vovó'], e:'P.S. quer dizer pós-escrito: algo escrito depois da assinatura.'},
 {t:'carta', q:'Por que Theo e o pai riram na praia?', o:['Uma onda derrubou o castelo de areia','O pai caiu na água','Viram um cachorro','Começou a chover'], e:'O texto diz: "Uma onda derrubou tudo, mas a gente riu muito."'},
 {t:'carta', q:'A linguagem desta carta é...', o:['Informal e carinhosa','Difícil e cheia de termos técnicos','Igual à de uma bula de remédio','Só com números'], e:'Carta pessoal é para pessoas próximas: usa palavras do dia a dia e carinho, como "abraço bem apertado".'},
 {q:'Para quem costumamos escrever uma carta pessoal?', o:['Pessoas próximas, como família e amigos','Uma empresa, para reclamar','Um jornal, para dar notícia','Ninguém, é só um diário'], e:'A carta pessoal é trocada entre pessoas que se conhecem e têm intimidade.'},
 {q:'No envelope, o CEP serve para...', o:['Ajudar o correio a encontrar o endereço','Dizer o nome de quem escreveu','Colar o selo','Mostrar a data'], e:'CEP é o Código de Endereçamento Postal: números que indicam a rua e a cidade.'},
 {t:'carta', q:'Onde e quando a carta foi escrita?', o:['No Rio de Janeiro, em 9 de novembro de 2026','Na casa da vovó, nas férias','Na praia, no sábado','Na escola, ontem'], e:'Essa informação fica no começo da carta: local e data.'},
 {t:'carta', q:'"Um abraço bem apertado do seu neto" é qual parte da carta?', o:['Despedida','Saudação','Corpo','P.S.'], e:'A despedida vem antes da assinatura e encerra a mensagem com carinho.'},
 {t:'carta', q:'O que Theo quer mostrar para a vovó nas férias?', o:['O feijãozinho que plantou','O castelo de areia','Um bolo de cenoura','A escola nova'], e:'"Quero te mostrar o meu feijãozinho, que já está bem alto."'},
 {q:'No livro, quem escreveu a carta para o primo Lucas contando sobre os Três Reis Magos?', o:['Carolina','Frederico','Pepe','Lili'], e:'Carolina é a remetente; o primo Lucas é o destinatário.'},
 {q:'Por que Carolina escreveu para o primo Lucas?', o:['Para contar a tradição dos Três Reis Magos, porque ele gosta de histórias de reis','Para pedir um presente de Natal','Para convidar Lucas para uma festa','Para reclamar do correio'], e:'Ela sabia que Lucas gosta de histórias sobre reis e cavaleiros.'},
 {q:'Em "De carta em carta", para quem Pepe escreveu para ajudar o avô?', o:['Para o governo','Para a professora','Para o seu Miguel','Para o carteiro'], e:'Pepe escreveu ao "Seu Governo" pedindo que o avô pudesse descansar, ou seja, se aposentar.'},
 {q:'Em "De carta em carta", por que o avô José estava tão cansado?', o:['Trabalhou a vida inteira como jardineiro','Ficou acordado jogando','Estava com gripe','Correu uma maratona'], e:'Ele cuidou de jardins e canteiros a vida toda e merecia se aposentar.'},
 {q:'No fim de "De carta em carta", Pepe se tornou...', o:['atendente do governo','escrevedor','professor','jardineiro'], e:'Pepe não virou escrevedor: foi trabalhar no posto de atendimento do governo, ajudando pessoas com a aposentadoria.'},
 {q:'Na cidade de Pepe, o que faziam os "escrevedores"?', o:['Escreviam cartas para quem não sabia escrever','Entregavam as cartas','Vendiam papel','Ensinavam futebol'], e:'Muita gente não sabia ler nem escrever e pedia ajuda aos escrevedores, como o seu Miguel.'},
 {q:'Por que o e-mail substituiu muitas cartas?', o:['Chega muito mais rápido e não precisa ir ao correio','Porque é escrito à mão','Porque precisa de selo','Porque demora meses'], e:'Mas o e-mail precisa de aparelho eletrônico, internet e endereço eletrônico.'},
 {q:'Num e-mail, o campo "Para:" mostra...', o:['o destinatário','o remetente','a data','o CEP'], e:'"Para:" é quem recebe (destinatário). "De:" é quem envia (remetente).'},
 {q:'Antigamente, como as cartas viajavam até o destinatário?', o:['De navio, trem, a cavalo e até com pombos-correio','Só pela internet','Por telefone','Por mensagem de celular'], e:'Por isso as cartas demoravam dias e até meses para chegar.'},
 {q:'Quantos algarismos tem o CEP?', o:['8','5','3','10'], e:'O CEP tem oito números, que indicam a região do país e as subdivisões do endereço.'},
 {q:'A palavra "caligrafia" quer dizer...', o:['escrita bela','escrita rápida','escrita no computador','escrita secreta'], e:'Vem do grego: kalos (beleza) + graphia (escrita).'},
 {q:'Como as pessoas da Pré-História registravam o dia a dia?', o:['Com desenhos nas paredes das cavernas (arte rupestre)','Com e-mails','Com cartas no correio','Com máquinas de escrever'], e:'No Brasil, o Parque Nacional da Serra da Capivara, no Piauí, tem muitas pinturas rupestres.'},
 {q:'O papiro, que os egípcios usavam para fazer folhas, é...', o:['uma planta aquática','um tipo de pedra','uma pena de pássaro','um animal'], e:'Com o papiro, os egípcios faziam folhas para seus registros.'},
 {q:'Johannes Gutenberg ficou famoso por criar...', o:['a primeira máquina de impressão de letras','o primeiro e-mail','o selo do correio','o CEP'], e:'A máquina de Gutenberg imprimia letras, números e outros símbolos.'},
 {q:'Qual a diferença entre diário e carta?', o:['O diário é escrito para o próprio autor ler','O diário sempre vai pelo correio','O diário não tem data','A carta é secreta e ninguém lê'], e:'O diário é como uma carta endereçada a nós mesmos: é pessoal e não é para ser compartilhado.'},
 {q:'No diário da Lili, que parte do corpo ficou doendo depois da festa?', o:['Os pés, porque ela dançou','As mãos, porque escreveu muito','A barriga, porque comeu bolo','A cabeça, por causa da música'], e:'Ela jogou dama, cantou e até dançou, e depois os PÉS doeram. Releia com calma o que o texto diz!'},
 {q:'Quais partes da carta também aparecem no diário da Lili?', o:['Data, saudação, corpo do texto e despedida','Selo e CEP','Remetente e destinatário no envelope','Título e moral'], e:'Ela começa com a data, escreve "Querido amigo!" e termina com uma despedida.'},
 {q:'Para que serve um diário?', o:['Registrar o que acontece na nossa vida para não esquecer','Mandar recados para a escola','Vender coisas','Contar fábulas com moral'], e:'No diário organizamos pensamentos e lembranças. Cada diário é único.'},
 {q:'Para que servem o local e a data no início da carta?', o:['Para saber onde e quando a carta foi escrita','Para o carteiro achar a casa','Para pagar o selo','Para mostrar quem vai receber'], e:'Assim o destinatário sabe de onde e de quando são as notícias.'},
 {type:'order', q:'Coloque as partes da carta pessoal na ordem certa (como no livro).', items:['Local e data','Saudação','Corpo da carta','Despedida','Assinatura'], e:'Local e data, saudação, corpo da carta, despedida e assinatura. O P.S. é opcional e vem depois da assinatura.'}

 {t:'relato', q:'O que aconteceu no 4º dia no copo A?', o:['Apareceram pequenas raízes brancas','Nasceu uma flor','Os feijões incharam','Nada mudou'], e:'O registro do 4º dia diz: "apareceram pequenas raízes brancas no copo A".'},
 {t:'relato', q:'Por que os feijões do copo B não cresceram?', o:['Porque ficaram sem água','Porque ficaram longe do sol','Porque eram feijões diferentes','Porque o copo era pequeno'], e:'Os dois copos ficaram na janela. A única diferença era a água: o copo B ficou seco.'},
 {t:'relato', q:'"Colocamos", "molhamos" e "deixamos" mostram que o relato...', o:['Conta o que já aconteceu (passado), escrito por "nós"','Conta o que vai acontecer no futuro','É uma história inventada','É uma carta'], e:'No relato usamos verbos no passado, porque contamos o que fizemos e observamos.'},

function textBox(key, labeled){
  const T = TEXTS[key];
  let html = T.html;
  if (labeled && key==='carta'){
    html = `
    <div class="part"><span class="tag">Local e data</span><p>Rio de Janeiro, 9 de novembro de 2026.</p></div>
    <div class="part"><span class="tag">Saudação</span><p>Querida vovó Lia,</p></div>
    <div class="part"><span class="tag">Corpo da carta</span><div style="display:flex;flex-direction:column;gap:8px"><p>Estou com muita saudade de você e do seu bolo de cenoura! Aqui em casa está tudo bem. Na semana passada, a minha turma fez uma experiência de ciências: plantamos feijões no algodão e vimos as raízes nascerem. Eu fui o responsável por regar todos os dias!</p><p>No sábado, fui à praia com o papai e construímos um castelo de areia enorme. Uma onda derrubou tudo, mas a gente riu muito.</p><p>Quando você vier nas férias, quero te mostrar o meu feijãozinho, que já está bem alto.</p></div></div>
    <div class="part"><span class="tag">Despedida</span><p>Um abraço bem apertado do seu neto,</p></div>
    <div class="part"><span class="tag">Assinatura</span><p>Theo</p></div>
    <div class="part"><span class="tag">P.S.</span><p>P.S.: Não esqueça de trazer a receita do bolo!</p></div>`;
  }
  return `<div class="text" id="txt-${key}${labeled?'-l':''}">${html}</div>
    <button class="say" onclick="falarEl('txt-${key}${labeled?'-l':''}')">${SAY_ICON} Ouvir o texto</button>`;
}

function pick(a,n){ return shuffle(a).slice(0,n); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function startQuiz(items, ctx){ Q = {items, i:0, score:0, combo:0, best:0, wrong:[], ctx}; initItem(); renderQ(); }
function initItem(){
  const it = Q.items[Q.i];
  Q.answered=false; Q.phase=1; Q.picked=null; Q.tonicOk=false; Q.clsPicked=null; Q.lastOk=null; Q.optPicked=null; Q.sel=[];

function renderQ(){

}
function textDetails(it){
  if(!it.t) return '';
  return `<details><summary>Ler o texto: ${TEXTS[it.t].titulo}</summary>${textBox(it.t)}</details>`;
}
function fbHtml(ok, exp, extra){
  return `<div class="fb ${ok?'ok':'no'}"><b class="h">${ok?PRAISE[Math.floor(Math.random()*PRAISE.length)]:OOPS[Math.floor(Math.random()*OOPS.length)]}</b>
    ${extra||''}<span>${exp||''}</span></div>
    <div class="row"><button class="btn" id="nextbtn" onclick="nextQ()">${Q.i+1<Q.items.length?'Próxima →':'Ver resultado'}</button></div>`;
}
/* múltipla escolha */
function mcHtml(it){
  const opts = Q.opts.map((o,i)=>{
    let c='opt';
    if (Q.answered){ if(o===it.o[0]) c+=' right'; else if(i===Q.optPicked) c+=' wrong'; }
    return `<button class="${c}" ${Q.answered?'disabled':''} onclick="answerMC(${i})">${esc(o)}</button>`;
  }).join('');
  return `${textDetails(it)}<p class="q">${esc(it.q)}</p><div class="opts">${opts}</div>${Q.answered?fbHtml(Q.lastOk, it.e, Q.lastOk?'':`<span>Resposta certa: <b>${esc(it.o[0])}</b></span>`):''}`;
}
function answerMC(i){
  if (Q.answered) return;
  const it=Q.items[Q.i]; Q.optPicked=i;
  const ok = Q.opts[i]===it.o[0];
  record(it, ok, it.q, it.o[0], it.e);
  renderQ(); focusNext();
}
/* sílaba forte */
function tonicHtml(it){
  const w=it.w, L=w.syl.length;
  const tiles = w.syl.map((s,i)=>{
    let c='syl';
    if (Q.phase>1){ if(i===w.t) c+=' hit'; else if(i===Q.picked) c+=' miss'; }
    return `<div class="sylcol"><button class="${c}" ${Q.phase>1?'disabled':''} onclick="pickSyl(${i})">${s}</button><span class="pos">${Q.phase>1?POSNAME(L-i):''}</span></div>`;
  }).join('');
  const say = canSpeak?`<button class="say" onclick="falar('${w.word}')">${SAY_ICON} Ouvir a palavra</button>`:'';
  let html = `<p class="q">${Q.phase===1?'Toque na sílaba mais forte:':'Agora classifique a palavra:'}</p>
    <div class="syls">${tiles}</div><div class="row" style="justify-content:center">${say}</div>`;
  if (Q.phase>=2){
    const strong = w.syl[w.t].toUpperCase();
    html += Q.tonicOk ? `<p class="sub" style="color:var(--ok)">Isso! A sílaba forte é ${strong}.</p>`
                      : `<p class="sub" style="color:var(--bad)">A sílaba forte é ${strong}, não ${w.syl[Q.picked].toUpperCase()}. Fale chamando: "${w.syl.map((s,i)=>i===w.t?s.toUpperCase():s).join('-')}!"</p>`;
    const cls = ['oxítona','paroxítona','proparoxítona'].map(c=>{
      let k='opt';
      if (Q.answered){ if(c===w.cls) k+=' right'; else if(c===Q.clsPicked) k+=' wrong'; }
      return `<button class="${k}" style="text-align:center" ${Q.answered?'disabled':''} onclick="pickCls('${c}')">${c}</button>`;
    }).join('');
    html += `<div class="cls3">${cls}</div>`;
  }
  if (Q.answered){
    const fe = L - w.t; const marked = w.syl.map((s,i)=>i===w.t?s.toUpperCase():s).join('-');
    let exp = `${marked}: a sílaba forte é a <b>${POSNAME(fe)}</b>, então a palavra é <b>${w.cls}</b>.`;
    if (w.cls==='proparoxítona') exp += ' Lembre: toda proparoxítona tem acento.';
    if (w.cls==='oxítona' && !/[ãõ]/.test(w.word)) exp += /[áéóâêô]$|[áéóâêô]s$|ém$|éns$/.test(w.word) ? ' Tem acento porque termina em A, E, O, EM ou ENS.' : ' Não tem acento porque não termina em A, E, O, EM ou ENS.';
    html += fbHtml(Q.lastOk, exp);
  }
  return html;
}
function pickSyl(i){
  if (Q.phase!==1) return;
  const it=Q.items[Q.i]; Q.picked=i; Q.tonicOk = i===it.w.t; Q.phase=2;
  if (canSpeak) falar(it.w.word);
  renderQ();
}
function pickCls(c){
  if (Q.answered) return;
  const it=Q.items[Q.i]; Q.clsPicked=c;
  const ok = Q.tonicOk && c===it.w.cls;
  const marked = it.w.syl.map((s,i)=>i===it.w.t?s.toUpperCase():s).join('-');
  record(it, ok, `Palavra: ${it.w.word}`, `${marked} (${it.w.cls})`, '');
  renderQ(); focusNext();
}
/* ordenar */
function orderHtml(it){
  const placed = Q.sel.map((x,k)=>{
    let c='piece'; if (Q.answered) c += x===it.items[k]?' right':' wrong';
    return `<button class="${c}" ${Q.answered?'disabled':''} onclick="unpick(${k})"><span class="n">${k+1}</span>${esc(x)}</button>`;
  }).join('');
  const pool = Q.pool.map((x,k)=>Q.sel.includes(x)?'':`<button class="piece" onclick="pickPiece(${k})">${esc(x)}</button>`).join('');
  let html = `${textDetails(it)}<p class="q">${esc(it.q)}</p>
    <p class="sub">Toque nas peças na ordem certa. Para tirar uma peça, toque nela de novo.</p>
    <div class="ordrow">${placed || '<span class="ph">Sua sequência aparece aqui</span>'}</div>
    ${Q.answered?'':`<div class="pool">${pool}</div>`}`;
  if (!Q.answered && Q.sel.length===it.items.length) html += `<div class="row"><button class="btn" onclick="checkOrder()">Conferir</button></div>`;
  if (Q.answered) html += fbHtml(Q.lastOk, it.e, Q.lastOk?'':`<span>Ordem certa: <b>${it.items.map(esc).join(' → ')}</b></span>`);
  return html;
}
function pickPiece(k){ if(Q.answered) return; const x=Q.pool[k]; if(x!=null && !Q.sel.includes(x)) Q.sel.push(x); renderQ(); }
function unpick(k){ if(Q.answered) return; Q.sel.splice(k,1); renderQ(); }
function checkOrder(){
  const it=Q.items[Q.i];
  const ok = Q.sel.every((x,k)=>x===it.items[k]);
  record(it, ok, it.q, it.items.join(' → '), it.e);
  renderQ(); focusNext();
}
/* registro */
function record(it, ok, label, correct, exp){
  Q.answered=true; Q.lastOk=ok;
  const t = S.topics[it.topic] || (S.topics[it.topic]={ok:0,total:0});
  t.total++;
  if (ok){ t.ok++; Q.score++; Q.combo++; S.xp += 10 + (Q.combo>=3?5:0); }
  else { Q.combo=0; S.missed[label]=(S.missed[label]||0)+1; Q.wrong.push({label, correct, exp, topic:it.topic}); }
  save();
}
function focusNext(){ const b=document.getElementById('nextbtn'); if(b){ b.focus({preventScroll:true}); b.scrollIntoView({block:'nearest', behavior:'smooth'}); } }
function nextQ(){ Q.i++; if (Q.i>=Q.items.length) return finish(); initItem(); renderQ(); irTopo(); }

/* ===================== RESULTADO ===================== */
function finish(){
  const n=Q.items.length, p=Q.score/n;
  const stars = p>=0.9?3:p>=0.7?2:p>=0.5?1:0;
  let head='';
  if (Q.ctx.world){
    const r = S.worlds[Q.ctx.world] || (S.worlds[Q.ctx.world]={stars:0,best:0,plays:0});
    r.plays++; r.stars=Math.max(r.stars,stars); r.best=Math.max(r.best,Math.round(p*100));
    head = `${starsHtml(stars)}<h2>${stars===3?'Mundo dominado!':stars===2?'Muito bom!':stars===1?'Bom começo!':'Vamos treinar mais um pouco!'}</h2>
      <p class="sub">Você acertou ${Q.score} de ${n}.${stars<3?' Faça 9 ou 10 acertos para ganhar 3 estrelas.':''}</p>`;
  } else {
    const nota = p*10; S.simCount=(S.simCount||0)+1; S.simBest = S.simBest==null?nota:Math.max(S.simBest,nota);
    head = `<span class="sub">Sua nota no simulado</span><span class="grade">${fmt(nota)}</span>
      <h2>${nota>=9?'Pronto para a prova!':nota>=7?'Muito bem! Revise os erros abaixo.':'Vamos revisar e tentar de novo!'}</h2>
      <p class="sub">Você acertou ${Q.score} de ${n}.</p>`;
  }
  save();
  const wrong = Q.wrong.length ? `<div class="miss-list"><h3>Para revisar</h3>${Q.wrong.map(w=>`
      <div class="miss-item"><span><b>${esc(w.label)}</b></span><span class="c">Certo: ${esc(w.correct)}</span>${w.exp?`<span class="sub" style="font-weight:600">${esc(w.exp).replace(/&lt;br&gt;/g,' ')}</span>`:''}</div>`).join('')}</div>` : '<div class="good" style="width:100%">Nenhum erro. Gabaritou!</div>';
  app.innerHTML = `
    <div class="card result" style="--wc:var(${Q.ctx.cor})">
      ${head}
      <div class="row" style="justify-content:center">
        <button class="btn" onclick="${Q.ctx.world?`startWorld('${Q.ctx.world}')`:'startSim()'}">Jogar de novo</button>
        <button class="btn ghost" onclick="renderHome()">Voltar ao mapa</button>
      </div>
      ${wrong}
    </div>`;
  irTopo();
  if (stars===3 || (Q.ctx.sim && p>=0.9)) confetti();
}
function confetti(){
  try{ if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; }catch(e){}
  const cols=['--w1','--w2','--w3','--w4','--w5','--w6','--sun'];
  for(let i=0;i<60;i++){
    const d=document.createElement('div'); d.className='confetti';
    d.style.left=Math.random()*100+'vw'; d.style.background=`var(${cols[i%cols.length]})`;
    d.style.animationDelay=(Math.random()*0.6)+'s'; document.body.appendChild(d);
    setTimeout(()=>d.remove(), 2600);
  }
}

/* ===================== PAINEL DA FAMÍLIA ===================== */
let resetArmed=false;
function renderParents(){
  resetArmed=false;
  const bars = Object.keys(TOPIC_NAMES).map((k,i)=>{
    const t=S.topics[k]; const p = t&&t.total ? t.ok/t.total : null;
    const col = p==null?'var(--line)':p>=0.8?'var(--ok)':p>=0.6?'var(--sun)':'var(--bad)';
    return `<div class="bar"><span>${TOPIC_NAMES[k]}</span><span class="track"><i style="width:${p==null?0:Math.round(p*100)}%;background:${col}"></i></span><span class="v">${p==null?'–':Math.round(p*100)+'%'}</span></div>`;
  }).join('');
  const missed = Object.entries(S.missed).sort((a,b)=>b[1]-a[1]).slice(0,10);
  app.innerHTML = `
    <button class="btn ghost back" onclick="renderHome()">← Mapa</button>
    <div class="card">
      <h2>Painel da família</h2>
      <p class="sub">Acertos por assunto (verde a partir de 80%). Simulados feitos: ${S.simCount||0}${S.simBest!=null?` · melhor nota: ${fmt(S.simBest)}`:''}.</p>
      <div class="bars">${bars}</div>
    </div>
    <div class="card">
      <h3>O que ele mais errou</h3>
      ${missed.length?`<div class="miss-list">${missed.map(([k,v])=>`<div class="miss-item"><span>${esc(k)}</span><span class="sub">${v} ${v>1?'vezes':'vez'}</span></div>`).join('')}</div>`:'<p class="sub">Ainda sem erros registrados. Os erros aparecem aqui depois que ele jogar.</p>'}
    </div>
    <div class="card">
      <h3>O que as fichas mostraram</h3>
      <ul style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px">
        <li>Classificou <b>sofá</b> e <b>café</b> como paroxítonas (são oxítonas).</li>
        <li>Escreveu que a oxítona tem a sílaba forte "no início" e a proparoxítona "no final". O certo é: oxítona = última; paroxítona = penúltima; proparoxítona = antepenúltima.</li>
        <li>Classificou <b>matemática</b> como paroxítona (é proparoxítona).</li>
        <li>Na atividade de aula mais recente, classificou pé, café, casa, médico, sol e sofá corretamente. Melhorou!</li>
        <li>Acentuação de monossílabos e separação silábica estavam bem.</li>
      </ul>
    </div>
    <div class="card">
      <h3>O que o livro (capítulos 9 e 10) mostrou</h3>
      <ul style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px">
        <li><b>Diário da Lili (p. 22):</b> marcou as mãos como a parte do corpo que doeu. O texto diz que foram os <b>pés</b>, porque ela dançou. Vale treinar a releitura.</li>
        <li><b>Fábula "A raposa e o corvo" (p. 84):</b> respondeu que a história não traz ensinamento. Toda fábula tem uma moral.</li>
        <li><b>Diálogo (p. 85):</b> escreveu o pedido de desculpas como narração, sem travessão. Na prova, pedir diálogo = falas com travessão.</li>
        <li><b>"A cegonha e a raposa" (p. 89):</b> as perguntas sobre moral, tipo de discurso e expressão de tempo estão em branco. Bom para fazer com ele hoje.</li>
        <li>Mandou bem em carta (remetente, destinatário, saudação), monossílabos acentuados e nas características da raposa e do corvo.</li>
      </ul>
    </div>
    <div class="card">
      <h3>Para a noite antes da prova</h3>
      <ul style="margin:0;padding-left:22px;display:flex;flex-direction:column;gap:4px">
        <li>Peça para ele explicar em voz alta o truque de contar as sílabas de trás para a frente.</li>
        <li>Diga palavras do dia a dia (geladeira, televisão, mágico, chulé) e peça para ele "chamar" a palavra e classificar.</li>
        <li>Peça para ele dizer as 5 partes da carta e as 6 partes do relato sem olhar.</li>
        <li>Conte uma fábula curta e peça a moral. Depois peça para transformar uma fala em discurso indireto.</li>
        <li>Faça um simulado só no final, para ele dormir com uma nota boa na cabeça.</li>
      </ul>
    </div>
    <button class="btn ghost" id="resetbtn" style="align-self:flex-start" onclick="resetAll()">Apagar o progresso</button>`;
  irTopo();
}
function resetAll(){
  const b=document.getElementById('resetbtn');
  if(!resetArmed){ resetArmed=true; b.textContent='Toque de novo para confirmar'; return; }
  S={xp:0, worlds:{}, topics:{}, missed:{}, simBest:null, simCount:0}; save(); renderHome();
}

renderHome();
</script>

</body></html>
